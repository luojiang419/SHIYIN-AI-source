name: Build and publish Windows release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: shiyin-ai-production-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_REPO: luojiang419/SHIYIN-AI
  MINIMUM_VERSION: v1.0.101

jobs:
  release:
    name: Test, build, verify, and publish
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout full source history
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve next release version and idempotency
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:GH_TOKEN) { throw 'RELEASE_REPO_TOKEN is not configured.' }
          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GH_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
            'User-Agent' = 'SHIYIN-AI-Release-Workflow'
          }
          $api = "https://api.github.com/repos/$env:RELEASE_REPO"
          $releases = @(Invoke-RestMethod -Headers $headers -Uri "$api/releases?per_page=100")
          $marker = "source-sha:$env:GITHUB_SHA"
          $existing = @($releases | Where-Object { -not $_.draft -and $_.body -like "*$marker*" })
          if ($existing.Count -gt 0) {
            'skip=true' | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
            "existing_tag=$($existing[0].tag_name)" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
            "existing_url=$($existing[0].html_url)" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
            exit 0
          }
          try { $latestTag = (Invoke-RestMethod -Headers $headers -Uri "$api/releases/latest").tag_name }
          catch { if ($_.Exception.Response.StatusCode -eq 404) { $latestTag = '' } else { throw } }
          $next = python tools/resolve-release-version.py --latest $latestTag --minimum $env:MINIMUM_VERSION
          if ($LASTEXITCODE -ne 0 -or $next -notmatch '^\d+\.\d+\.\d+$') { throw "Version resolver returned invalid output: $next" }
          'skip=false' | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
          "version=$next" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
          "tag=v$next" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8

      - name: Set up Node.js
        if: steps.version.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Restore build dependencies
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pytest
          npm ci
          rustup default stable

      - name: Install Inno Setup
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        run: choco install innosetup --version=6.7.1 --no-progress --yes

      - name: Verify scripts and inject one release version
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        run: |
          python tools/resolve-release-version.py --self-test
          ./tools/prepare-release.ps1 -Version '${{ steps.version.outputs.version }}'

      - name: Automated contract tests
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        env:
          CI: 'true'
        run: |
          python -m pytest -q tests/test_desktop_updater_contract.py
          cargo test --manifest-path src-tauri/Cargo.toml updater::tests --locked

      - name: Build Windows installer EXE
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        run: ./tools/build-installer.ps1

      - name: Verify release artifact
        if: steps.version.outputs.skip != 'true'
        id: artifact
        shell: pwsh
        run: ./tools/verify-installer-artifact.ps1 -Version '${{ steps.version.outputs.version }}'

      - name: Verify real previous-version update
        if: steps.version.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ Accept = 'application/vnd.github+json'; Authorization = "Bearer $env:GH_TOKEN"; 'User-Agent' = 'SHIYIN-AI-Updater-E2E' }
          $latest = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/$env:RELEASE_REPO/releases/latest"
          $fromInstaller = @($latest.assets | Where-Object { $_.name -eq "SHIYIN-AI-Setup-$($latest.tag_name -replace '^v', '').exe" })
          if ($latest.draft -or $latest.prerelease) { throw 'Latest release cannot be used as the updater E2E source.' }
          if ($fromInstaller.Count -ne 1) { throw 'Latest release does not expose the installer required by the updater smoke test.' }
          $fromDir = Join-Path $env:RUNNER_TEMP 'shiyin-updater-from'
          New-Item -ItemType Directory -Force -Path $fromDir | Out-Null
          $fromPath = Join-Path $fromDir $fromInstaller[0].name
          Invoke-WebRequest -Headers $headers -Uri $fromInstaller[0].browser_download_url -OutFile $fromPath
          ./tools/smoke-installer-updater.ps1 -FromInstaller $fromPath -ToInstaller '${{ steps.artifact.outputs.asset_path }}' -ToVersion '${{ steps.version.outputs.version }}'

      - name: Create draft, upload, verify, and publish
        if: steps.version.outputs.skip != 'true'
        id: publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: >-
          ./tools/publish-release.ps1
          -Version '${{ steps.version.outputs.version }}'
          -SourceRepo '${{ github.repository }}'
          -SourceSha '${{ github.sha }}'
          -AssetPath '${{ steps.artifact.outputs.asset_path }}'
          -ChecksumPath '${{ steps.artifact.outputs.checksum_path }}'
          -ReleaseNotesPath './release-notes/current.md'
          -SignatureStatus '${{ steps.artifact.outputs.signature_status }}'

      - name: Idempotent release summary
        if: steps.version.outputs.skip == 'true'
        shell: pwsh
        run: |
          Write-Host "Source commit already published as ${{ steps.version.outputs.existing_tag }}"
          Write-Host "${{ steps.version.outputs.existing_url }}"
