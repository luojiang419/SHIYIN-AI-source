<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHIYIN AI 正在更新</title>
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; background: #101418; color: #e8edf3; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #101418; }
    main { width: min(640px, calc(100vw - 56px)); padding: 34px 38px; border: 1px solid #30343a; border-radius: 18px; background: #171b20; box-shadow: 0 24px 80px #0008; }
    .brand { color: #9aa4af; font-size: 12px; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 10px 0 8px; font-size: 25px; font-weight: 600; }
    #message { margin: 0; color: #c5cbd3; font-size: 15px; }
    #substep { min-height: 22px; margin: 8px 0 26px; color: #89939e; font-size: 13px; }
    ol { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; }
    li { display: flex; align-items: center; gap: 12px; color: #78828c; font-size: 14px; }
    li::before { content: ""; width: 9px; height: 9px; border: 1px solid #5b6570; border-radius: 50%; }
    li.active, li.done { color: #e8edf3; }
    li.active::before { border-color: #c5cbd3; background: #c5cbd3; box-shadow: 0 0 0 5px #c5cbd322; }
    li.done::before { border-color: #69b783; background: #69b783; }
    #error { display: none; margin-top: 22px; padding: 12px 14px; border: 1px solid #814d52; border-radius: 10px; color: #f0a7a7; background: #3b2024; white-space: pre-wrap; }
    #error.visible { display: block; }
  </style>
</head>
<body>
  <main>
    <div class="brand">SHIYIN AI</div>
    <h1>正在更新软件</h1>
    <p id="message">正在准备独立更新器…</p>
    <p id="substep"></p>
    <ol id="steps">
      <li>准备安装</li>
      <li>关闭旧版本</li>
      <li>安装新版本</li>
      <li>启动新版本</li>
      <li>完成</li>
    </ol>
    <div id="error"></div>
  </main>
  <script>
    (() => {
      const invoke = window.__TAURI__?.core?.invoke || window.__TAURI_INTERNALS__?.invoke;
      const listen = window.__TAURI__?.event?.listen;
      const steps = [...document.querySelectorAll('#steps li')];
      const message = document.getElementById('message');
      const substep = document.getElementById('substep');
      const error = document.getElementById('error');
      function render(event) {
        const data = event?.payload || event || {};
        const index = Number(data.stepIndex ?? 0);
        steps.forEach((step, stepIndex) => {
          step.classList.toggle('active', stepIndex === index && !data.isSuccess && !data.isError);
          step.classList.toggle('done', stepIndex < index || data.isSuccess);
        });
        message.textContent = data.message || '正在更新…';
        substep.textContent = data.substep || '';
        if (data.isError) {
          error.textContent = data.message || '更新失败，请重新打开软件后重试。';
          error.classList.add('visible');
        }
      }
      async function start() {
        if (!invoke) {
          render({stepIndex: 2, message: '更新器运行环境不可用。', substep: '请重新打开软件后重试。', isError: true});
          return;
        }
        if (listen) {
          await listen('update-progress', render);
        } else {
          render({stepIndex: 0, message: '更新器正在启动…', substep: '正在连接更新会话。'});
        }
      }
      start();
    })();
  </script>
</body>
</html>
