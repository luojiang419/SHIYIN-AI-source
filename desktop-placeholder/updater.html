<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SHIYIN AI 正在更新</title>
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; background: #101418; color: #e8edf3; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #101418; }
    main { width: min(640px, calc(100vw - 56px)); padding: 34px 38px; border: 1px solid #30343a; border-radius: 18px; background: #171b20; box-shadow: 0 24px 80px #0008; }
    .brand { color: #9aa4af; font-size: 12px; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 10px 0 8px; font-size: 25px; font-weight: 600; }
    #message { margin: 0; color: #c5cbd3; font-size: 15px; }
    #substep { min-height: 22px; margin: 8px 0 8px; color: #89939e; font-size: 13px; }
    .progress-overview { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin: 28px 0 10px; }
    .progress-caption { display: block; margin-bottom: 5px; color: #89939e; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
    #stage { color: #e8edf3; font-size: 14px; }
    #progress-percent { color: #e8edf3; font-size: 32px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
    .progress-track { overflow: hidden; height: 10px; border: 1px solid #3c444d; border-radius: 999px; background: #0d1013; }
    #progress-fill { width: 0%; height: 100%; border-radius: inherit; background: #aeb8c3; box-shadow: 0 0 14px #aeb8c355; }
    #progress-fill.success { background: #69b783; box-shadow: 0 0 14px #69b78355; }
    #progress-fill.error { background: #d27676; box-shadow: 0 0 14px #d2767655; }
    #progress-note { margin: 9px 0 0; color: #78828c; font-size: 12px; }
    ol { display: grid; gap: 12px; margin: 0; padding: 0; list-style: none; }
    li { display: flex; align-items: center; gap: 12px; color: #78828c; font-size: 14px; }
    li::before { content: ""; width: 9px; height: 9px; border: 1px solid #5b6570; border-radius: 50%; }
    li.active, li.done { color: #e8edf3; }
    li.active::before { border-color: #c5cbd3; background: #c5cbd3; box-shadow: 0 0 0 5px #c5cbd322; }
    li.done::before { border-color: #69b783; background: #69b783; }
    #error { display: none; margin-top: 22px; padding: 12px 14px; border: 1px solid #814d52; border-radius: 10px; color: #f0a7a7; background: #3b2024; white-space: pre-wrap; }
    #error.visible { display: block; }
  </style>
</head>
<body>
  <main>
    <div class="brand">SHIYIN AI</div>
    <h1>正在更新软件</h1>
    <div class="progress-overview">
      <div>
        <span class="progress-caption">更新进度</span>
        <strong id="stage">准备安装</strong>
      </div>
      <strong id="progress-percent" aria-live="polite">0%</strong>
    </div>
    <div class="progress-track" role="progressbar" aria-label="更新进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div id="progress-fill"></div>
    </div>
    <p id="progress-note">更新器启动后会持续显示处理进度。</p>
    <p id="message">正在准备独立更新器…</p>
    <p id="substep"></p>
    <ol id="steps">
      <li>准备安装</li>
      <li>关闭旧版本</li>
      <li>安装新版本</li>
      <li>启动新版本</li>
      <li>完成</li>
    </ol>
    <div id="error"></div>
  </main>
  <script>
    (() => {
      const invoke = window.__TAURI__?.core?.invoke || window.__TAURI_INTERNALS__?.invoke;
      const listen = window.__TAURI__?.event?.listen;
      const steps = [...document.querySelectorAll('#steps li')];
      const stage = document.getElementById('stage');
      const progressPercent = document.getElementById('progress-percent');
      const progressTrack = document.querySelector('.progress-track');
      const progressFill = document.getElementById('progress-fill');
      const progressNote = document.getElementById('progress-note');
      const message = document.getElementById('message');
      const substep = document.getElementById('substep');
      const error = document.getElementById('error');
      function renderPercent(value) {
        value = Math.max(0, Math.min(100, Number(value) || 0));
        progressFill.style.width = `${value}%`;
        progressPercent.textContent = `${value}%`;
        progressTrack.setAttribute('aria-valuenow', String(value));
      }

      function render(event) {
        const data = event?.payload || event || {};
        const index = Number(data.stepIndex ?? 0);
        const reportedPercent = Number(data.progressPercent ?? 0);
        renderPercent(reportedPercent);
        steps.forEach((step, stepIndex) => {
          step.classList.toggle('active', stepIndex === index && !data.isSuccess && !data.isError);
          step.classList.toggle('done', stepIndex < index || data.isSuccess);
        });
        stage.textContent = data.stepLabel || '更新中';
        message.textContent = data.message || '正在更新…';
        substep.textContent = data.substep || '';
        progressNote.textContent = data.isSuccess
          ? '更新已完成，正在启动新版软件。'
          : data.isError
            ? '更新没有完成，当前软件未被修改。'
            : index === 2
              ? '安装阶段按安装器实时回调推进。'
              : '更新器正在执行当前步骤。';
        progressFill.classList.toggle('success', Boolean(data.isSuccess));
        progressFill.classList.toggle('error', Boolean(data.isError));
        if (data.isError) {
          error.textContent = data.message || '更新失败，请重新打开软件后重试。';
          error.classList.add('visible');
        }
      }
      async function start() {
        if (!invoke) {
          render({stepIndex: 2, progressPercent: 30, stepLabel: '更新失败', message: '更新器运行环境不可用。', substep: '请重新打开软件后重试。', isError: true});
          return;
        }
        render({stepIndex: 0, progressPercent: 1, stepLabel: '准备安装', message: '更新器正在启动…', substep: '正在连接更新会话。'});
        if (listen) {
          try {
            await listen('update-progress', render);
          } catch (err) {
            render({stepIndex: 0, progressPercent: 1, stepLabel: '准备安装', message: '更新器正在启动…', substep: '进度监听未就绪，更新会话将继续执行。'});
          }
        }
        try {
          await invoke('run_update_session');
        } catch (err) {
          render({stepIndex: 2, progressPercent: 30, stepLabel: '更新失败', message: String(err || '更新器启动失败。'), substep: '请重新打开软件后重试。', isError: true});
        }
      }
      start();
    })();
  </script>
</body>
</html>
