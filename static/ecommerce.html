<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电商专用</title>
    <script>
        (function(){
            try {
                var theme = localStorage.getItem('studio_theme') || localStorage.getItem('canvas_theme') || 'system';
                if(theme === 'system') theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                if(theme === 'dark') document.documentElement.classList.add('studio-theme-dark');
                if(theme === 'pure-white') {
                    document.documentElement.classList.add('studio-theme-pure-white');
                    document.documentElement.classList.add('theme-pure-white');
                }
            } catch(e) {}
        })();
    </script>
    <script src="/static/js/theme.js?v=2026.07.31.theme-picker.1"></script>
    <script src="/static/js/focus-guard.js?v=2026.08.02.ime-focus.1"></script>
    <script src="/static/js/i18n.js?v=2026.08.09.universal-routes.1"></script>
    <link rel="stylesheet" href="/static/css/theme.css?v=2026.07.22.1">
    <link rel="stylesheet" href="/static/css/compare-viewer.css?v=2026.07.22.1">
    <link rel="stylesheet" href="/static/css/ecommerce.css?v=2026.08.10.universal-plan-banner-removed.1">
</head>
<body>
    <main id="ecommercePage" class="ec-page">
        <header class="ec-topbar">
            <nav id="operationTabs" class="ec-operation-tabs" aria-label="电商功能">
                <button class="active" type="button" data-operation="universal"><span>01</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 1.4 4.1L17.5 8.5l-4.1 1.4L12 14l-1.4-4.1-4.1-1.4 4.1-1.4L12 3ZM18.5 14l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8.8-2.2Z"/></svg><b data-i18n="ecommerce.universal">全能模式</b></button>
                <button type="button" data-operation="try_on"><span>02</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8 5 2-2h4l2 2 3 2-2 4-2-1v10H9V10l-2 1-2-4 3-2Z"/><path d="M10 3c0 1.3.7 2 2 2s2-.7 2-2"/></svg><b data-i18n="ecommerce.tryOn">自由换衣</b></button>
                <button type="button" data-operation="pose_transfer"><span>03</span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="2"/></svg><b data-i18n="ecommerce.poseTransfer">动作迁移</b></button>
                <button type="button" data-operation="prop_replace"><span>04</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9h14l1 11H4L5 9Z"/><path d="M9 9V7a3 3 0 0 1 6 0v2M8 14h8"/></svg><b data-i18n="ecommerce.propReplace">道具替换</b></button>
                <button type="button" data-operation="angle_change"><span>05</span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"/><path d="M12 8v4l3 2M4 5l2 2M20 5l-2 2"/></svg><b data-i18n="ecommerce.angleChange">角度修改</b></button>
                <button type="button" data-operation="background_change"><span>06</span><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg><b data-i18n="ecommerce.backgroundChange">背景修改</b></button>
            </nav>
            <div class="ec-header-actions">
                <button id="historyToggle" class="ec-icon-button" type="button" data-i18n-title="ecommerce.history" aria-label="任务历史">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v6h6M12 7v5l3 2"/></svg>
                </button>
            </div>
        </header>

        <section id="ecommerceWorkspace" class="ec-workspace">
            <aside id="controlPanel" class="ec-control-panel">
                <div id="controlInputMount">
                    <section id="inputModule" class="ec-input-module">
                        <div class="ec-section-head">
                            <div><span>INPUT</span><h2 data-i18n="ecommerce.inputs">输入素材</h2></div>
                            <span id="inputProgress">0/2</span>
                        </div>
                        <div id="inputSlots" class="ec-input-slots"></div>
                    </section>
                </div>

                <div id="operationControls" class="ec-operation-controls"></div>

                <section id="advancedSettings" class="ec-model-panel">
                    <button id="modelPanelToggle" class="ec-model-panel-toggle" type="button" aria-expanded="true" aria-controls="modelPanelBody">
                        <span class="ec-model-panel-heading">
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M4 12h4M12 12h8M14 5v4M8 15v4M10 10v4"/></svg>
                            <span><b data-i18n="ecommerce.modelSettings">模型设置</b><small id="modelPanelSelection">—</small></span>
                        </span>
                        <span class="ec-model-panel-actions"><em data-i18n="ecommerce.apiImage">API 生图</em><svg class="ec-model-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5"/></svg></span>
                    </button>
                    <div id="modelPanelBody" class="ec-model-panel-body">
                        <div class="ec-field-grid ec-model-route-grid">
                            <label><span data-i18n="ecommerce.provider">平台</span><select id="providerSelect"></select></label>
                            <label><span data-i18n="ecommerce.model">模型</span><select id="modelSelect"></select></label>
                        </div>
                        <div class="ec-field-grid ec-parameter-grid">
                            <label><span data-i18n="ecommerce.aspectRatio">比例</span><select id="ratioSelect">
                                <option value="source" data-i18n="ecommerce.ratioSource">跟随原图</option>
                                <option value="1:1">1:1</option>
                                <option value="2:3">2:3</option>
                                <option value="3:2">3:2</option>
                                <option value="3:4">3:4</option>
                                <option value="4:3">4:3</option>
                                <option value="4:5">4:5</option>
                                <option value="9:16">9:16</option>
                                <option value="16:9">16:9</option>
                            </select></label>
                            <label><span data-i18n="ecommerce.resolution">分辨率</span><select id="resolutionSelect">
                                <option value="auto" data-i18n="ecommerce.autoRecommendedSimple">智能推荐</option>
                                <option value="1k">1K</option>
                                <option value="2k">2K</option>
                                <option value="4k">4K</option>
                            </select></label>
                            <label><span data-i18n="ecommerce.quality">质量</span><select id="qualitySelect">
                                <option value="auto" data-i18n="ecommerce.autoRecommendedSimple">智能推荐</option>
                                <option value="low" data-i18n="ecommerce.qualityLow">低</option>
                                <option value="medium" data-i18n="ecommerce.qualityMedium">中</option>
                                <option value="high" data-i18n="ecommerce.qualityHigh">高</option>
                            </select></label>
                            <label><span data-i18n="ecommerce.outputCount">生成数量</span><select id="countSelect">
                                <option value="0" data-i18n="ecommerce.autoRecommendedSimple">智能推荐</option>
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                            </select></label>
                        </div>
                        <p data-i18n="ecommerce.advancedHint">只显示当前已保存、已启用并配置了 API Key 的图像 API；实际路由会记录在任务中。</p>
                    </div>
                </section>

                <div id="controlActionMount">
                    <section id="generateActions" class="ec-generate-actions">
                        <button id="addUniversalReference" class="ec-add-reference ec-add-reference-action hidden" type="button"></button>
                        <div id="formError" class="ec-inline-error hidden" role="alert"></div>
                        <button id="generateButton" class="ec-primary-button" type="button">
                            <span data-i18n="ecommerce.generate">开始生成</span>
                            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 1.4 4.1L17.5 8.5l-4.1 1.4L12 14l-1.4-4.1-4.1-1.4 4.1-1.4L12 3ZM18.5 14l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8.8-2.2Z"/></svg>
                        </button>
                    </section>
                </div>
            </aside>

            <section class="ec-result-panel">
                <div class="ec-section-head ec-result-head">
                    <div><span>OUTPUT</span><h2 data-i18n="ecommerce.resultPreview">结果预览</h2></div>
                    <button id="compareReset" class="ec-text-button" type="button" data-i18n="ecommerce.resetCompare">对比复位</button>
                </div>

                <div class="ec-result-body">
                    <div id="emptyResult" class="ec-empty-result">
                        <div id="emptyResultNotice" class="ec-result-notice hidden" role="alert">
                            <strong id="emptyResultNoticeTitle"></strong>
                            <p id="emptyResultNoticeMessage"></p>
                        </div>
                        <div class="ec-empty-symbol"><span></span><span></span></div>
                        <h3 data-i18n="ecommerce.emptyTitle">准备好素材后开始生成</h3>
                        <p data-i18n="ecommerce.emptyHint">结果会保留为独立版本，原图不会被覆盖</p>
                    </div>

                    <div id="resultWorkspace" class="hidden">
                        <div class="ec-result-frame-wrap">
                            <div class="ec-result-frame">
                                <div id="resultMeta" class="ec-result-meta" aria-label="生成信息"></div>
                                <div id="compareStage" class="ec-compare-stage">
                                    <img id="beforeBackdrop" class="ec-compare-backdrop" aria-hidden="true" alt="">
                                    <img id="beforeImage" class="ec-before-image" data-compare-before alt="原图">
                                    <div id="afterClip" class="ec-after-clip" data-compare-after-clip>
                                        <img id="afterBackdrop" class="ec-compare-backdrop" aria-hidden="true" alt="">
                                        <img id="afterImage" class="ec-after-image" data-compare-after alt="生成图">
                                    </div>
                                    <button id="compareHandle" class="ec-compare-handle" data-compare-handle type="button" role="slider" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" aria-label="原图与生成图对比">
                                        <span>‹</span><span>›</span>
                                    </button>
                                    <span id="compareBeforeLabel" class="ec-compare-label compare-viewer-label before" data-i18n="ecommerce.before">原图</span>
                                    <span class="ec-compare-label compare-viewer-label after" data-i18n="ecommerce.after">生成图</span>
                                    <div class="ec-compare-tools compare-viewer-tools" aria-label="缩放工具">
                                        <button id="zoomOut" type="button" data-compare-zoom-out data-i18n-title="ecommerce.zoomOut" aria-label="缩小">−</button>
                                        <button id="zoomReset" type="button" data-compare-zoom-label data-i18n-title="ecommerce.zoomReset" aria-label="适合窗口">1×</button>
                                        <button id="zoomIn" type="button" data-compare-zoom-in data-i18n-title="ecommerce.zoomIn" aria-label="放大">＋</button>
                                        <button id="compareFullscreen" type="button" data-compare-fullscreen data-i18n-title="ecommerce.fullscreenCompare" aria-label="全屏对比"><span class="compare-viewer-fullscreen-enter">⛶</span><span class="compare-viewer-fullscreen-exit">×</span></button>
                                    </div>
                                    <div id="generationOverlay" class="ec-generation-overlay hidden">
                                        <div class="ec-spinner"></div>
                                        <strong data-i18n="ecommerce.generating">正在生成</strong>
                                        <span id="generationTimer">00:00</span>
                                        <small id="generationMessage"></small>
                                    </div>
                                    <div id="resultErrorOverlay" class="ec-result-error-overlay hidden" role="alert">
                                        <div class="ec-result-error-card">
                                            <strong id="resultErrorTitle"></strong>
                                            <p id="resultErrorMessage"></p>
                                            <button id="resultErrorClear" class="ec-secondary-button compact hidden" type="button" data-i18n="ecommerce.clearFailedTask">清理失败任务</button>
                                        </div>
                                    </div>
                                </div>
                                <div class="ec-result-footer">
                                    <div id="candidateList" class="ec-candidate-list" aria-label="生成结果切换"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <section id="universalDock" class="ec-universal-dock hidden" aria-label="全能模式参考素材">
                <div id="universalDockInputs" class="ec-universal-dock-inputs"></div>
                <div id="universalDockActions" class="ec-universal-dock-actions"></div>
            </section>
        </section>
    </main>

    <aside id="taskDrawer" class="ec-drawer" aria-hidden="true">
        <header><div><small>VERSIONS</small><h2 data-i18n="ecommerce.history">任务历史</h2></div><button id="closeHistory" class="ec-icon-button" type="button" aria-label="关闭">×</button></header>
        <div id="taskList" class="ec-task-list"></div>
    </aside>
    <div id="drawerBackdrop" class="ec-backdrop hidden"></div>

    <dialog id="assetDialog" class="ec-dialog ec-asset-dialog">
        <form method="dialog" class="ec-dialog-shell">
            <header><div><small>ASSETS</small><h2 id="assetDialogTitle" data-i18n="ecommerce.chooseAsset">从素材库选择</h2></div><button value="cancel" class="ec-icon-button" aria-label="关闭">×</button></header>
            <div class="ec-dialog-toolbar"><select id="assetLibrarySelect"></select><select id="assetCategorySelect"></select><select id="assetReferenceTypeSelect" class="hidden" aria-label="参考图类型"></select></div>
            <div id="assetGrid" class="ec-asset-grid"></div>
            <div class="ec-dialog-actions"><button id="assetSaveConfirm" class="ec-primary-button compact hidden" type="button" data-i18n="ecommerce.saveHere">保存到此分组</button></div>
        </form>
    </dialog>

    <dialog id="studioDialog" class="ec-dialog ec-studio-dialog">
        <form method="dialog" class="ec-dialog-shell">
            <header><div><small>STUDIO</small><h2 data-i18n="ecommerce.chooseStudioReference">选择摄影棚</h2></div><button value="cancel" class="ec-icon-button" aria-label="关闭">×</button></header>
            <div id="studioReferenceGrid" class="ec-studio-reference-grid" aria-label="摄影棚类型"></div>
            <div class="ec-dialog-actions"><button id="studioClear" class="ec-secondary-button" type="button" data-i18n="ecommerce.clearStudioReference">不使用摄影棚</button></div>
        </form>
    </dialog>

    <dialog id="qualityDialog" class="ec-dialog ec-quality-dialog">
        <form id="qualityForm" method="dialog" class="ec-dialog-shell">
            <header><div><small>QUALITY GATE</small><h2 data-i18n="ecommerce.qualityTitle">上架前人工验收</h2></div><button value="cancel" class="ec-icon-button" aria-label="关闭">×</button></header>
            <p class="ec-quality-intro" data-i18n="ecommerce.qualityIntro">生成图只有在所有检查项确认后，才会标记为上架成片。</p>
            <div id="qualityChecks" class="ec-quality-checks"></div>
            <label class="ec-review-note"><span data-i18n="ecommerce.reviewNote">验收备注（可选）</span><textarea id="qualityNote" maxlength="500"></textarea></label>
            <div class="ec-dialog-actions"><button value="cancel" class="ec-secondary-button" type="button" id="cancelQuality" data-i18n="ecommerce.cancel">取消</button><button id="approveQuality" class="ec-primary-button compact" type="submit" data-i18n="ecommerce.approve">确认通过</button></div>
        </form>
    </dialog>

    <dialog id="referencePreview" class="ec-reference-preview">
        <form method="dialog" class="ec-reference-preview-shell">
            <header class="ec-reference-preview-header">
                <div><small>REFERENCE</small><h2 id="referencePreviewTitle" data-i18n="ecommerce.referencePreviewTitle">参考图预览</h2></div>
                <div class="ec-reference-preview-modes">
                    <button id="referencePreviewMode" class="active" type="button" data-i18n="ecommerce.previewMode">预览</button>
                    <button id="referenceCropMode" type="button" data-i18n="ecommerce.cropMode">裁切</button>
                    <button value="cancel" class="ec-reference-preview-close" aria-label="关闭">×</button>
                </div>
            </header>
            <div id="referenceCropRatios" class="ec-reference-crop-ratios hidden" aria-label="裁切比例">
                <button type="button" data-crop-ratio="free" data-i18n="ecommerce.freeRatio">自由</button>
                <button type="button" data-crop-ratio="source" data-i18n="ecommerce.ratioSource">跟随原图</button>
                <button type="button" data-crop-ratio="1:1">1:1</button>
                <button type="button" data-crop-ratio="2:3">2:3</button>
                <button type="button" data-crop-ratio="3:2">3:2</button>
                <button type="button" data-crop-ratio="3:4">3:4</button>
                <button type="button" data-crop-ratio="4:3">4:3</button>
                <button type="button" data-crop-ratio="4:5">4:5</button>
                <button type="button" data-crop-ratio="9:16">9:16</button>
                <button type="button" data-crop-ratio="16:9">16:9</button>
            </div>
            <div class="ec-reference-preview-body">
                <div id="referencePreviewStage" class="ec-reference-preview-stage">
                    <img id="referencePreviewImage" alt="参考图预览">
                </div>
                <div id="referenceCropStage" class="ec-reference-crop-stage hidden">
                    <img id="referenceCropImage" alt="参考图裁切">
                    <div id="referenceCropBox" class="ec-reference-crop-box">
                        <span data-crop-handle="nw"></span><span data-crop-handle="ne"></span>
                        <span data-crop-handle="sw"></span><span data-crop-handle="se"></span>
                    </div>
                </div>
            </div>
            <footer class="ec-reference-preview-footer">
                <div id="referenceVersionList" class="ec-reference-version-list" aria-label="原图与裁切版本"></div>
                <div class="ec-reference-preview-actions">
                    <button id="useReferenceVersion" class="ec-secondary-button" type="button" data-i18n="ecommerce.useThisVersion">使用此版本</button>
                    <button id="applyReferenceCrop" class="ec-primary-button compact hidden" type="button" data-i18n="ecommerce.applyCrop">应用裁切</button>
                </div>
            </footer>
        </form>
    </dialog>

    <div id="toast" class="ec-toast" role="status"></div>
    <input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden>
    <script src="/static/js/compare-viewer.js?v=2026.07.22.1"></script>
    <script src="/static/js/ecommerce.js?v=2026.08.10.universal-plan-banner-removed.1"></script>
</body>
</html>
