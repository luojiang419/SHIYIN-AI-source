<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        html.studio-route-booting .app-shell {
            visibility: hidden;
        }
        #studio-boot-screen {
            position: fixed;
            inset: 0;
            z-index: 10000;
            display: grid;
            place-items: center;
            background: #f6eee4;
            color: #332d28;
            opacity: 1;
            visibility: visible;
            transition: opacity .18s ease, visibility .18s ease;
        }
        html.theme-dark #studio-boot-screen,
        html.studio-theme-dark #studio-boot-screen {
            background: #1b1b1b;
            color: #f0eee9;
        }
        html.theme-pure-white #studio-boot-screen,
        html.studio-theme-pure-white #studio-boot-screen {
            background: #fff;
            color: #171717;
        }
        html:not(.studio-route-booting) #studio-boot-screen {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .studio-boot-card {
            width: min(360px, calc(100vw - 40px));
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            text-align: center;
            font-family: "Segoe UI", sans-serif;
        }
        .studio-boot-mark {
            width: 48px;
            height: 48px;
            display: grid;
            place-items: center;
            border: 2px solid currentColor;
            border-radius: 16px;
            animation: studio-boot-turn 1.6s cubic-bezier(.3,0,0,1) infinite;
        }
        .studio-boot-dot {
            width: 8px;
            height: 8px;
            border-radius: 999px;
            background: currentColor;
        }
        .studio-boot-title { font-size: 18px; font-weight: 800; letter-spacing: .02em; }
        .studio-boot-message { min-height: 22px; color: #766f68; font-size: 13px; line-height: 1.6; }
        html.theme-dark .studio-boot-message,
        html.studio-theme-dark .studio-boot-message { color: #a7a6a2; }
        .studio-boot-retry {
            min-width: 96px;
            height: 36px;
            padding: 0 18px;
            border: 0;
            border-radius: 999px;
            background: currentColor;
            cursor: pointer;
        }
        .studio-boot-retry span { color: #fff; font-size: 13px; font-weight: 750; }
        html.theme-dark .studio-boot-retry span,
        html.studio-theme-dark .studio-boot-retry span { color: #171717; }
        @keyframes studio-boot-turn { 50% { transform: rotate(90deg); border-radius: 50%; } }
        @media (prefers-reduced-motion: reduce) { .studio-boot-mark { animation: none; } }
        [hidden] {
            display: none !important;
        }
    </style>
    <script>
        (function(){
            try {
                var theme = localStorage.getItem('studio_theme') || localStorage.getItem('canvas_theme') || 'system';
                if(theme === 'system') theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                if(theme === 'dark') {
                    document.documentElement.classList.add('studio-theme-dark');
                    document.documentElement.classList.add('theme-dark');
                }
                if(theme === 'pure-white') {
                    document.documentElement.classList.add('studio-theme-pure-white');
                    document.documentElement.classList.add('theme-pure-white');
                }
                document.documentElement.classList.add('studio-route-booting');
            } catch(e) {}
        })();
    </script>

    <style>
        @import url('/static/vendor/css/fonts.css?v=2026.06.30.1782781876');

        /* 本地 Tailwind 工具类兜底：CDN 慢/未就绪时也能立刻给图标尺寸，避免首屏左侧栏空白 */

        :root {
            --accent: #9a6636;
            --fluid-ease: cubic-bezier(0.3, 0, 0, 1);
            --bg: #f6eee4;
            --sidebar-bg: #faf2e7;
            --stage-bg: #f7f1e6;
            --border: rgba(91, 74, 54, 0.10);
            --stage-border: rgba(91, 74, 54, 0.12);
            --text: #332d28;
            --muted: #766f68;
            --nav-hover-bg: rgba(255, 249, 242, 0.72);
            --monitor-bg: rgba(251, 245, 238, 0.78);
            --monitor-border: rgba(91, 74, 54, 0.10);
            --monitor-shadow: rgba(92, 72, 48, 0.10);
            --divider: rgba(91, 74, 54, 0.12);
            --scrollbar: #d9cabb;
            --scrollbar-hover: #c7b29e;
        }

        html.theme-dark,
        body.theme-dark {
            --accent: #3a3a39;
            --bg: #1b1b1b;
            --sidebar-bg: #1e1f1f;
            --stage-bg: #1a1a1a;
            --border: rgba(255, 255, 255, 0.07);
            --stage-border: rgba(255, 255, 255, 0.08);
            --text: #f0eee9;
            --muted: #a7a6a2;
            --nav-hover-bg: rgba(255, 255, 255, 0.055);
            --monitor-bg: rgba(32, 32, 31, 0.82);
            --monitor-border: rgba(255, 255, 255, 0.08);
            --monitor-shadow: rgba(0, 0, 0, 0.34);
            --divider: rgba(255, 255, 255, 0.10);
            --scrollbar: #494947;
            --scrollbar-hover: #5c5c59;
        }

        html.studio-theme-pure-white,
        html.theme-pure-white,
        body.studio-theme-pure-white,
        body.theme-pure-white {
            --accent: #171717;
            --bg: #ffffff;
            --sidebar-bg: #fafafa;
            --stage-bg: #fafafa;
            --border: rgba(23, 23, 23, 0.12);
            --stage-border: rgba(23, 23, 23, 0.14);
            --text: #171717;
            --muted: #737373;
            --nav-hover-bg: rgba(23, 23, 23, 0.06);
            --monitor-bg: rgba(255, 255, 255, 0.88);
            --monitor-border: rgba(23, 23, 23, 0.12);
            --monitor-shadow: rgba(23, 23, 23, 0.12);
            --divider: rgba(23, 23, 23, 0.12);
            --scrollbar: #d4d4d4;
            --scrollbar-hover: #a3a3a3;
        }

        /* 极简滚动条 */
        html,
        body {
            overscroll-behavior: auto;
            height: 100%;
            overflow: hidden;
        }

        *::-webkit-scrollbar {
            width: 10px !important;
            height: 10px !important;
            background: transparent !important;
        }

        *::-webkit-scrollbar-track {
            background: transparent !important;
            border: none !important;
        }

        *::-webkit-scrollbar-thumb {
            background-color: var(--scrollbar) !important;
            border: 3px solid transparent !important;
            border-right-width: 3px !important;
            background-clip: padding-box !important;
            border-radius: 10px !important;
            min-height: 36px;
        }

        *::-webkit-scrollbar-thumb:hover {
            background-color: var(--scrollbar-hover) !important;
        }

        *::-webkit-scrollbar-corner {
            background: transparent !important;
        }

        * {
            scrollbar-width: thin !important;
            scrollbar-color: var(--scrollbar) transparent !important;
        }

        body {
            background: var(--bg);
            font-family: 'Space Grotesk', sans-serif;
            overflow: hidden;
            height: 100vh;
            color: var(--text);
            transition: background 0.3s, color 0.3s;
        }

        .app-shell {
            display: flex;
            width: 100%;
            height: 100vh;
            background: var(--bg);
            position: relative;
            transition: background 0.3s;
        }

        /* 侧边栏 */
        .sidebar {
            width: 80px;
            min-width: 80px;
            height: 100vh;
            max-height: 100vh;
            background: var(--sidebar-bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            border-right: 1px solid var(--border);
            padding: 40px 0;
            transition: width 0.5s var(--fluid-ease) 0.5s, background 0.3s, border-color 0.3s;
            z-index: 50;
            overflow: hidden;
        }

        .sidebar:hover {
            width: 220px;
            transition-delay: 0s;
        }

        /* 首次加载时与 iframe 的 0.5s 淡入同步播放，避免侧栏"焊死"在原地造成视觉断层 */
        @keyframes sidebar-enter {
            from { opacity: 0; transform: translateX(-6px); }
            to { opacity: 1; transform: translateX(0); }
        }
        html:not(.studio-route-booting) .sidebar {
            animation: sidebar-enter 0.5s var(--fluid-ease);
        }

        .logo-ring {
            width: 36px;
            height: 36px;
            border: 2px solid var(--text);
            border-radius: 12px;
            background: transparent;
            padding: 0;
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex: 0 0 auto;
            /* 仅保留 hover 真正会用到的属性过渡，避免 transition: all 因首屏属性补齐被意外触发 */
            transition: transform 0.6s var(--fluid-ease) 0.5s, border-radius 0.6s var(--fluid-ease) 0.5s, border-color 0.3s, background-color .18s, box-shadow .2s;
        }

        .sidebar:hover .logo-ring {
            transform: rotate(90deg);
            border-radius: 50%;
            transition-delay: 0s;
        }

        .logo-ring:hover,
        .logo-ring:focus-visible {
            background: var(--nav-hover-bg);
            border-color: var(--text);
            box-shadow: 0 0 0 4px rgba(148, 163, 184, .16), 0 10px 24px rgba(15, 23, 42, .08);
            outline: none;
        }

        .logo-ring:hover #logo-dot,
        .logo-ring:focus-visible #logo-dot {
            transform: scale(1.8);
        }

        .logo-ring:active {
            transform: scale(.94);
            transition-delay: 0s;
        }

        .sidebar:hover .logo-ring:active {
            transform: rotate(90deg) scale(.94);
        }

        #logo-dot {
            transition: transform .16s ease, background-color .16s ease, box-shadow .16s ease;
        }

        .product-brand {
            width: 100%;
            min-height: 40px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 48px;
            padding-left: 22px;
            overflow: hidden;
            flex: 0 0 auto;
        }

        .product-identity {
            max-width: 0;
            overflow: hidden;
            opacity: 0;
            color: var(--text);
            font-size: 13px;
            font-weight: 800;
            letter-spacing: .015em;
            white-space: nowrap;
            transition: max-width .3s var(--fluid-ease), opacity .2s ease;
        }

        .sidebar.is-pinned .product-identity {
            max-width: 145px;
            opacity: 1;
        }

        /* 导航项 */
        .nav-item {
            position: relative;
            width: 48px;
            height: 48px;
            flex: 0 0 48px;
            margin: 10px 0;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            border-radius: 18px;
            cursor: pointer;
            /* 只对 width 做带延迟的过渡（侧栏悬停展开效果）；background/color 不参与过渡，避免 active 切换时底色"流动" */
            transition: width 0.3s var(--fluid-ease) 0.5s;
            color: var(--muted);
            overflow: hidden;
            padding-left: 14px;
        }

        .sidebar:hover .nav-item {
            width: 190px;
            transition-delay: 0s;
        }

        .nav-item:hover {
            background: var(--nav-hover-bg);
            color: var(--text);
        }

        .nav-item.active {
            background: var(--accent);
            color: #fff;
        }

        html.theme-dark .nav-item.active,
        body.theme-dark .nav-item.active {
            background: #f1f5f9;
            color: #0f172a;
        }

        .nav-text {
            opacity: 0;
            margin-left: 16px;
            font-weight: 600;
            font-size: 14px;
            white-space: nowrap;
            transition: opacity 0.3s 0.5s;
        }

        .sidebar:hover .nav-text {
            opacity: 1;
            transition-delay: 0.1s;
        }

        .nav-fold-toggle {
            position: relative;
            width: 48px;
            height: 36px;
            flex: 0 0 36px;
            margin: 0 0 6px;
            padding-left: 14px;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: transparent;
            color: var(--muted);
            display: flex;
            align-items: center;
            justify-content: flex-start;
            cursor: pointer;
            overflow: hidden;
            transition: width 0.3s var(--fluid-ease) 0.5s, background-color 0.2s, color 0.2s, border-color 0.2s;
        }

        .sidebar:hover .nav-fold-toggle {
            width: 190px;
            transition-delay: 0s;
        }

        .nav-fold-toggle:hover {
            background: var(--nav-hover-bg);
            color: var(--text);
            border-color: var(--stage-border);
        }

        .nav-fold-icon {
            width: 18px;
            height: 18px;
            flex: 0 0 auto;
            transition: transform 0.25s var(--fluid-ease);
        }

        .nav-fold-toggle[aria-expanded="false"] .nav-fold-icon {
            transform: rotate(-90deg);
        }

        .nav-fold-group {
            width: 100%;
            flex: 0 0 auto;
            max-height: 720px;
            opacity: 1;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: max-height 0.3s var(--fluid-ease), opacity 0.2s ease;
        }

        .nav-fold-group.is-collapsed {
            max-height: 0;
            opacity: 0;
            pointer-events: none;
        }

        .sidebar nav {
            width: 100%;
            min-height: 0;
            flex: 1 1 auto;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 0 6px;
            overscroll-behavior: contain;
            scrollbar-gutter: stable;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            scrollbar-color: rgba(148, 163, 184, .34) transparent;
        }

        .sidebar::-webkit-scrollbar { width: 4px !important; }
        .sidebar::-webkit-scrollbar-track { background: transparent !important; }
        .sidebar::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, .34) !important;
            border: 0 !important;
            border-radius: 999px !important;
        }

        .sidebar nav::-webkit-scrollbar { width: 4px !important; }
        .sidebar nav::-webkit-scrollbar-track { background: transparent !important; }
        .sidebar nav::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, .34) !important;
            border: 0 !important;
            border-radius: 999px !important;
        }

        .sidebar nav > * {
            flex-shrink: 0;
        }

        /* 主舞台区 */
        .stage {
            flex: 1;
            background: var(--stage-bg);
            margin: 16px;
            border-radius: 32px;
            overflow: hidden;
            border: 1px solid var(--stage-border);
            position: relative;
            transition: background 0.3s, border-color 0.3s;
        }

        iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            opacity: 0;
            visibility: hidden;
            transform: none;
            filter: none;
            transition: opacity 0.18s var(--fluid-ease), visibility 0.18s var(--fluid-ease);
            pointer-events: none;
        }

        iframe.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        /* 左下角监视器 */
        .nano-monitor {
            position: absolute;
            bottom: 24px;
            left: 24px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--monitor-bg);
            padding: 7px 12px;
            border-radius: 12px;
            border: 1px solid var(--monitor-border);
            box-shadow: 0 4px 20px var(--monitor-shadow);
            font-family: monospace;
            transition: all 0.4s var(--fluid-ease);
        }

        .nano-monitor.is-busy {
            background: #000;
            color: #fff;
            border-color: rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
        }

        .stat-group {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 11px;
            font-weight: 700;
            color: var(--text);
        }

        .stat-group:first-child {
            gap: 8px;
        }

        .nano-monitor.is-busy .stat-group {
            color: #fff;
        }

        .divider {
            width: 1px;
            height: 12px;
            background: var(--divider);
        }

        .is-busy .divider {
            background: rgba(255, 255, 255, 0.2);
        }

        .pulse-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #10b981;
            margin-right: 2px;
            flex: 0 0 auto;
        }

        .spinner-nano {
            width: 10px;
            height: 10px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        .is-busy .spinner-nano { display: block; }
        .is-busy .pulse-dot { display: none; }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .label-nano {
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.5;
            font-size: 9px;
        }

        .side-actions {
            margin-top:12px;
            margin-bottom:12px;
            display:flex;
            flex-direction:column;
            align-items:center;
            gap:8px;
            width:100%;
            flex:0 0 auto;
        }

        .side-pill {
            width:44px;
            height:36px;
            border-radius:999px;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            /* 只过渡 hover/激活会改的属性，避免 all 触发延迟 */
            transition: width 0.3s var(--fluid-ease) 0.5s, gap 0.3s var(--fluid-ease) 0.5s, background-color 0.2s, color 0.2s, border-color 0.2s;
            flex-shrink: 0;
            overflow:hidden;
            gap:8px;
            position:relative;
        }

        .sidebar:hover .side-pill {
            width: 170px;
            transition-delay: 0s;
        }

        .side-pill:hover {
            background: var(--nav-hover-bg);
            color: var(--text);
            border-color: var(--stage-border);
        }

        .side-pill.active {
            background: var(--text);
            color: var(--bg);
            border-color: var(--text);
        }

        .theme-picker-panel {
            width: min(480px, 100%);
        }

        .theme-picker-intro {
            margin: 0 0 16px;
            color: var(--muted);
            font-size: 12px;
            line-height: 1.55;
        }

        .theme-picker-options {
            display: grid;
            gap: 10px;
        }

        .theme-option {
            width: 100%;
            display: grid;
            grid-template-columns: 46px minmax(0, 1fr) auto;
            align-items: center;
            gap: 12px;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: color-mix(in srgb, var(--sidebar-bg) 94%, transparent);
            color: var(--text);
            text-align: left;
            cursor: pointer;
            transition: transform .18s var(--fluid-ease), background-color .18s ease, border-color .18s ease, box-shadow .18s ease;
        }

        .theme-option:hover,
        .theme-option:focus-visible {
            transform: translateY(-1px);
            border-color: var(--stage-border);
            background: var(--nav-hover-bg);
            outline: none;
        }

        .theme-option.active {
            border-color: var(--text);
            background: color-mix(in srgb, var(--sidebar-bg) 82%, var(--nav-hover-bg));
            box-shadow: 0 10px 24px rgba(23, 23, 23, .10), inset 0 0 0 1px color-mix(in srgb, var(--text) 10%, transparent);
        }

        .theme-option-swatch {
            width: 46px;
            height: 46px;
            display: block;
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,.72);
        }

        .theme-option-swatch.ivory {
            background: linear-gradient(145deg, #faf2e7, #f1e5d7);
        }

        .theme-option-swatch.night {
            background: linear-gradient(145deg, #30302f, #171717);
            border-color: rgba(255,255,255,.16);
        }

        .theme-option-swatch.pure {
            background: linear-gradient(145deg, #ffffff, #f5f5f5);
            border-color: rgba(23,23,23,.18);
        }

        .theme-option-copy {
            min-width: 0;
        }

        .theme-option-title,
        .theme-option-desc {
            display: block;
        }

        .theme-option-title {
            font-size: 13px;
            font-weight: 900;
        }

        .theme-option-desc {
            margin-top: 3px;
            overflow: hidden;
            color: var(--muted);
            font-size: 10px;
            line-height: 1.45;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .theme-option-check {
            width: 22px;
            height: 22px;
            display: grid;
            place-items: center;
            border: 1px solid var(--border);
            border-radius: 50%;
            color: transparent;
        }

        .theme-option.active .theme-option-check {
            border-color: var(--text);
            background: var(--text);
            color: var(--bg);
        }

        .theme-option-check svg {
            width: 13px;
            height: 13px;
        }

        html.studio-theme-pure-white .theme-picker-panel,

                    <div class="studio-modal-kicker">SHIYING API</div>
                    <h2 id="shiying-api-key-title" class="studio-modal-title">填写 shiying 平台 API Key</h2>
                </div>
                <button class="studio-modal-close" type="button" onclick="dismissShiyingApiKeyModal()" title="稍后设置" aria-label="稍后设置">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="studio-modal-body">
                <p class="studio-modal-copy">首次使用全能模式和自由换衣前，需要先填写 shiying 平台 API Key。保存后会立即生效，不需要重启软件。</p>
                <div class="shiying-key-form">
                    <label class="shiying-key-label" for="shiyingApiKeyInput">API Key</label>
                    <input id="shiyingApiKeyInput" class="shiying-key-input" type="password" autocomplete="off" placeholder="粘贴 shiying API Key">
                    <p id="shiyingApiKeyStatus" class="shiying-key-status" role="status"></p>
                </div>
            </div>
            <div class="studio-modal-actions">
                <button class="studio-modal-btn" type="button" onclick="dismissShiyingApiKeyModal()">
                    <span>稍后设置</span>
                </button>
                <button id="shiyingApiKeySaveBtn" class="studio-modal-btn primary" type="button" onclick="saveShiyingApiKeyFromModal()">
                    <span>保存并开始使用</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        const ACTIVE_PAGE_KEY = 'studio_active_page';
        const SIDEBAR_SETTINGS_COLLAPSED_KEY = 'studio_sidebar_settings_collapsed';
        const SIDEBAR_PINNED_KEY = 'studio_sidebar_pinned';
        const SIDEBAR_MANUAL_MODE_KEY = 'studio_sidebar_manual_mode_v1';
        const DEFAULT_PAGE_ID = 'ecommerce';
        const PAGE_IDS = ['ecommerce','gpt-chat','canvas','asset-manager','works','api-settings','app-settings'];
        const PROJECT_URL = 'https://github.com/luojiang419/SHIYIN-AI-source';
        const ADMIN_PAGE_IDS = new Set(['api-settings', 'app-settings']);
        const STUDIO_BOOT_TIMEOUT_MS = 6000;
        let currentStudioAccount = null;
        let studioBootInFlight = false;
        let appInfo = { version:'', repo_url:PROJECT_URL, version_url:'https://raw.githubusercontent.com/luojiang419/SHIYIN-AI-source/main/VERSION' };
        let updateConnectivityResult = null;
        let projectUpdateRunning = false;
        let projectUpdateAbort = null;  // 当前更新请求的 AbortController，便于用户中途取消
        let updateSource = localStorage.getItem('studio_update_source') || 'github';
        let projectUpdateNotes = null;
        let shiyingApiKeyProviders = [];

        function shiyingProviderFallback() {
            return {
                id:'shiying',
                name:'shiying',
                base_url:'https://www.shiying-api.com',
                protocol:'openai',
                image_request_mode:'openai',
                image_generation_endpoint:'',
                image_edit_endpoint:'',
                enabled:true,
                primary:false,
                image_models:['gemini-3-pro-image-preview'],
                chat_models:[],
                video_models:[],
                model_protocols:{'gemini-3-pro-image-preview':'gemini'},
                ms_loras:[],
                ms_defaults_version:0,
                rh_apps:[],
                rh_workflows:[]
            };
        }

        function providerSavePayload(item, extra = {}) {
            return {
                id:item.id,
                name:item.name || item.id,
                base_url:item.base_url || '',
                protocol:item.protocol || 'openai',
                image_request_mode:item.image_request_mode || 'openai',
                image_generation_endpoint:item.image_generation_endpoint || '',
                image_edit_endpoint:item.image_edit_endpoint || '',
                enabled:item.enabled !== false,
                primary:item.primary === true,
                image_models:Array.isArray(item.image_models) ? item.image_models : [],
                chat_models:Array.isArray(item.chat_models) ? item.chat_models : [],
                video_models:Array.isArray(item.video_models) ? item.video_models : [],
                model_protocols:item.model_protocols && typeof item.model_protocols === 'object' ? item.model_protocols : {},
                ms_loras:Array.isArray(item.ms_loras) ? item.ms_loras : [],
                ms_defaults_version:Number(item.ms_defaults_version || 0),
                rh_apps:Array.isArray(item.rh_apps) ? item.rh_apps : [],
                rh_workflows:Array.isArray(item.rh_workflows) ? item.rh_workflows : [],
                volcengine_project_name:item.volcengine_project_name || 'default',
                volcengine_region:item.volcengine_region || 'cn-beijing',
                ...extra
            };
        }

        function setShiyingApiKeyStatus(message, isError = false) {
            const status = document.getElementById('shiyingApiKeyStatus');
            if(!status) return;
            status.textContent = message || '';
            status.classList.toggle('error', isError);
        }

        function showShiyingApiKeyModal(providers) {
            shiyingApiKeyProviders = Array.isArray(providers) ? providers : [];
            const modal = document.getElementById('shiying-api-key-modal');
            const input = document.getElementById('shiyingApiKeyInput');
            if(!modal || !input) return;
            setShiyingApiKeyStatus('');
            modal.hidden = false;
            setTimeout(() => input.focus(), 60);
        }

        function dismissShiyingApiKeyModal() {
            const modal = document.getElementById('shiying-api-key-modal');
            if(modal) modal.hidden = true;
        }

        async function ensureShiyingApiKeyOnboarding() {
            try {
                const response = await fetch('/api/providers', {cache:'no-store'});
                const data = await response.json();
                if(!response.ok) throw new Error(data.detail || `HTTP ${response.status}`);
                const providers = Array.isArray(data.providers) ? data.providers : [];
                const shiying = providers.find(item => item.id === 'shiying');
                if(shiying?.has_key) return;
                showShiyingApiKeyModal(providers);
            } catch(error) {
                console.warn('检查 shiying API Key 失败', error);
            }
        }

        async function saveShiyingApiKeyFromModal() {
            const input = document.getElementById('shiyingApiKeyInput');
            const saveBtn = document.getElementById('shiyingApiKeySaveBtn');
            const key = input?.value.trim() || '';
            if(!key) {
                setShiyingApiKeyStatus('请输入 shiying 平台 API Key。', true);
                input?.focus();
                return;
            }
            if(saveBtn) saveBtn.disabled = true;
            setShiyingApiKeyStatus('正在保存...');
            try {
                let providers = Array.isArray(shiyingApiKeyProviders) ? [...shiyingApiKeyProviders] : [];
                if(!providers.length) {
                    const response = await fetch('/api/providers', {cache:'no-store'});
                    const data = await response.json();
                    if(!response.ok) throw new Error(data.detail || `HTTP ${response.status}`);
                    providers = Array.isArray(data.providers) ? data.providers : [];
                }
                const shiying = providers.find(item => item.id === 'shiying');
                if(!shiying) providers.unshift(shiyingProviderFallback());
                const payload = providers.map(item => {
                    const normalized = item.id === 'shiying' ? {...shiyingProviderFallback(), ...item} : item;
                    return providerSavePayload(normalized, item.id === 'shiying' ? {api_key:key} : {});
                });
                const response = await fetch('/api/providers', {
                    method:'PUT',
                    headers:{'Content-Type':'application/json'},
                    body:JSON.stringify(payload)
                });
                const data = await response.json().catch(() => ({}));
                if(!response.ok) throw new Error(data.detail || `HTTP ${response.status}`);
                shiyingApiKeyProviders = Array.isArray(data.providers) ? data.providers : providers;
                if(input) input.value = '';
                setShiyingApiKeyStatus('已保存，可以开始生成。');
                broadcastStudioApiChange({type:'providers-changed', updated_at:Date.now()});
                setTimeout(dismissShiyingApiKeyModal, 520);
            } catch(error) {
                setShiyingApiKeyStatus(error.message || '保存失败，请检查 API Key 后重试。', true);
            } finally {
                if(saveBtn) saveBtn.disabled = false;
            }
        }

        function setSidebarPinned(pinned, options = {}) {
            const sidebar = document.getElementById('studioSidebar');
            const logo = document.getElementById('sidebarLogoToggle');
            if(!sidebar) return;
            sidebar.classList.toggle('is-pinned', pinned);
            if(logo) {
                logo.setAttribute('aria-pressed', pinned ? 'true' : 'false');
                logo.title = pinned ? '收起导航栏' : '展开导航栏';
            }
            if(!options.skipRemember) localStorage.setItem(SIDEBAR_PINNED_KEY, pinned ? '1' : '0');
        }

        function toggleSidebarPinned(event) {
            event?.preventDefault?.();
            event?.stopPropagation?.();
            const sidebar = document.getElementById('studioSidebar');
            setSidebarPinned(!sidebar?.classList.contains('is-pinned'));
        }

        function restoreSidebarPinned() {
            if(localStorage.getItem(SIDEBAR_MANUAL_MODE_KEY) !== '1') {
                localStorage.setItem(SIDEBAR_MANUAL_MODE_KEY, '1');
                localStorage.setItem(SIDEBAR_PINNED_KEY, '1');
            }
            setSidebarPinned(localStorage.getItem(SIDEBAR_PINNED_KEY) !== '0', { skipRemember:true });
        }

        function setSidebarSettingsCollapsed(collapsed, options = {}) {
            const group = document.getElementById('settings-fold-group');
            const toggle = document.getElementById('settings-fold-toggle');
            if(group) group.classList.toggle('is-collapsed', collapsed);
            if(toggle) {
                toggle.setAttribute('aria-expanded', collapsed ? 'false' : 'true');
                toggle.title = collapsed ? '展开设置' : '收起设置';
            }
            if(!options.skipRemember) localStorage.setItem(SIDEBAR_SETTINGS_COLLAPSED_KEY, collapsed ? '1' : '0');
        }

        function toggleSidebarSettings() {
            const group = document.getElementById('settings-fold-group');
            setSidebarSettingsCollapsed(!group?.classList.contains('is-collapsed'));
        }

        function restoreSidebarSettings(id) {
            const savedCollapsed = id === 'app-settings' ? false : localStorage.getItem(SIDEBAR_SETTINGS_COLLAPSED_KEY) !== '0';
            setSidebarSettingsCollapsed(savedCollapsed, { skipRemember:true });
        }

        function resetStudioRootScroll() {
            try {
                window.scrollTo(0, 0);
                document.documentElement.scrollTop = 0;
                document.body.scrollTop = 0;
            } catch(e) {}
        }

        function syncRouteStateToFrame(iframe) {
            if(!iframe) return;
            const active = iframe.classList.contains('active');
            iframe.dataset.routeActive = active ? '1' : '0';
            if(!iframe.src) return;
            try {
                iframe.contentWindow?.postMessage({
                    type:'studio-route-active',
                    active,
                    pageId:String(iframe.id || '').replace(/^frame-/, ''),
                }, '*');
            } catch(e) {}
        }

        function broadcastRouteState() {
            document.querySelectorAll('iframe').forEach(syncRouteStateToFrame);
        }

        const IFRAME_IDLE_UNLOAD_MS = 15 * 60 * 1000;
        const IFRAME_KEEP_RECENT = 2;
        const IFRAME_PROTECTED_PAGES = new Set(['ecommerce','canvas']);
        // 页面切换的“无等待”依赖 iframe 文档已经初始化。首屏只等待当前页面，
        // 其它页面在遮罩解除后分批预加载，避免多个重量级画布脚本同时争用主线程。
        const STUDIO_FRAME_READY_TIMEOUT_MS = 1800;
        const STUDIO_FRAME_PRELOAD_CONCURRENCY = 3;
        const STUDIO_KEEP_PRELOADED_FRAMES = true;
        let studioFramePreloadStarted = false;
        let studioFramePreloadPromise = null;
        let studioFramePreloadPaused = false;
        const studioFrameReadyState = Object.create(null);

        function pauseStudioFramePreload(reason='navigation') {
            studioFramePreloadPaused = true;
            document.documentElement.dataset.studioPreload = 'paused';
            window.dispatchEvent(new CustomEvent('studio-frame-preload-paused', {detail:{reason}}));
        }

        function touchFrameUsage(id) {
            const frame = document.getElementById('frame-' + id);
            if(frame) frame.dataset.lastActiveAt = String(Date.now());
        }

        function ensureStudioFrameSource(frame) {
            if(!frame) return false;
            if(!frame.src) {
                const source = frame.dataset.src || '';
                if(!source) return false;
                frame.src = source;
            }
            return true;
        }

        function waitForStudioFrame(frame, timeout = STUDIO_FRAME_READY_TIMEOUT_MS) {
            if(!frame) return Promise.resolve(false);
            ensureStudioFrameSource(frame);
            if(frame.dataset.frameReady === '1') return Promise.resolve(true);
            try {
                if(frame.contentDocument?.readyState === 'complete') {
                    frame.dataset.frameReady = '1';
                    return Promise.resolve(true);
                }
            } catch(e) {}
            return new Promise(resolve => {
                let settled = false;
                const done = (ready) => {
                    if(settled) return;
                    settled = true;
                    window.clearTimeout(timer);
                    frame.removeEventListener('load', onLoad);
                    frame.removeEventListener('error', onError);
                    resolve(ready);
                };
                const onLoad = () => {
                    frame.dataset.frameReady = '1';
                    done(true);
                };
                const onError = () => done(false);
                const timer = window.setTimeout(() => done(false), timeout);
                frame.addEventListener('load', onLoad, {once:true});
                frame.addEventListener('error', onError, {once:true});
            });
        }

        function preloadStudioFrames(activeId) {
            if(studioFramePreloadStarted) return studioFramePreloadPromise || Promise.resolve();
            studioFramePreloadStarted = true;
            const queue = PAGE_IDS.filter(id => {
                if(id === activeId) return false;
                if(ADMIN_PAGE_IDS.has(id) && !currentStudioAccount?.is_admin) return false;
                return true;
            });
            let cursor = 0;
            const worker = async () => {
                while(cursor < queue.length) {
                    if(studioFramePreloadPaused) break;
                    const id = queue[cursor++];
                    const frame = document.getElementById('frame-' + id);
                    if(!frame) continue;
                    frame.dataset.preload = '1';
                    ensureStudioFrameSource(frame);
                    touchFrameUsage(id);
                    const ready = await waitForStudioFrame(frame, STUDIO_FRAME_READY_TIMEOUT_MS);
                    studioFrameReadyState[id] = ready ? 'ready' : 'error';
                    frame.dataset.frameReadyState = studioFrameReadyState[id];
                    window.dispatchEvent(new CustomEvent('studio-frame-ready', {detail:{id, ready}}));
                }
            };
            // 受控并行：同时启动三个页面，既能尽快完成整体预热，也避免多个画布脚本
            // 一次性抢占主线程。Promise 会在所有可用页面完成 load/超时后结束。
            studioFramePreloadPromise = Promise.all(
                Array.from({length:Math.min(STUDIO_FRAME_PRELOAD_CONCURRENCY, queue.length)}, worker)
            ).then(() => {
                document.documentElement.dataset.studioPreload = 'ready';
                window.dispatchEvent(new CustomEvent('studio-all-frames-ready', {detail:{states:{...studioFrameReadyState}}}));
            });
            return studioFramePreloadPromise;
        }

        function maybeUnloadIdleFrames() {
            if(STUDIO_KEEP_PRELOADED_FRAMES) return;
            const now = Date.now();
            const frames = [...document.querySelectorAll('iframe')]
                .filter(frame => frame.src && !frame.classList.contains('active'))
                .map(frame => ({
                    frame,
                    pageId:String(frame.id || '').replace(/^frame-/, ''),
                    last:Number(frame.dataset.lastActiveAt || 0),
                    dirty:frame.dataset.studioDirty === '1',
                }))
                .filter(item => !item.dirty && !IFRAME_PROTECTED_PAGES.has(item.pageId))
                .sort((a,b) => b.last - a.last);
            frames.slice(IFRAME_KEEP_RECENT).forEach(item => {
                if(now - item.last < IFRAME_IDLE_UNLOAD_MS) return;
                try {
                    item.frame.removeAttribute('src');
                    item.frame.dataset.routeActive = '0';
                } catch(e) {}
            });
        }

        function focusStudioFrame(iframe) {
            if(!iframe) return;
            requestAnimationFrame(() => {
                if(!iframe.classList.contains('active')) return;
                try { iframe.focus({preventScroll:true}); }
                catch(e) { try { iframe.focus(); } catch(ignore) {} }
                try { iframe.contentWindow?.focus?.(); } catch(e) {}
            });
        }

        function switchUI(el, id, options = {}) {
            resetStudioRootScroll();
            if(!PAGE_IDS.includes(id)) id = DEFAULT_PAGE_ID;
            if(ADMIN_PAGE_IDS.has(id) && !currentStudioAccount?.is_admin) id = DEFAULT_PAGE_ID;
            document.querySelectorAll('.nav-item,.side-pill').forEach(n => n.classList.remove('active'));
            if(el) el.classList.add('active');
            document.querySelectorAll('iframe').forEach(f => f.classList.remove('active'));
            const target = document.getElementById('frame-' + id);
            target.classList.add('active');
            ensureStudioFrameSource(target);
            touchFrameUsage(id);
            broadcastRouteState();
            maybeUnloadIdleFrames();
            if(!options.skipRemember) localStorage.setItem(ACTIVE_PAGE_KEY, id);
            // sync theme to newly activated iframe
            syncThemeToFrame(target);
            syncLanguageToFrame(target);
            if (id === 'canvas' && target.src) {
                try { target.contentWindow?.postMessage({ type: 'canvas-focus' }, '*'); } catch(e) {}
            }
            focusStudioFrame(target);
            resetStudioRootScroll();
        }

        function forwardStudioApiChange(data) {
            if(!data || data.type !== 'providers-changed') return;
            document.querySelectorAll('iframe').forEach(iframe => {
                try {
                    if (iframe && iframe.contentWindow) iframe.contentWindow.postMessage(data, '*');
                } catch(e) {}
            });
        }

        function forwardShortcutSettingsChange(data) {
            if(!data || data.type !== 'shortcut-bindings:changed') return;
            document.querySelectorAll('iframe').forEach(iframe => {
                try {
                    if(iframe?.contentWindow) iframe.contentWindow.postMessage(data, '*');
                } catch(e) {}
            });
        }

        function broadcastStudioApiChange(message = {type:'providers-changed'}) {
            const data = typeof message === 'string'
                ? {type:message, updated_at:Date.now()}
                : {...message, updated_at:message.updated_at || Date.now()};
            forwardStudioApiChange(data);
            try { new BroadcastChannel('studio-api').postMessage(data); } catch(e) {}
            try { window.parent?.postMessage(data, '*'); } catch(e) {}
            try { window.top?.postMessage(data, '*'); } catch(e) {}
        }

        window.addEventListener('message', event => {
            if (event.origin && event.origin !== location.origin) return;
            if(event.data?.type === 'studio-preload-pause') pauseStudioFramePreload(event.data.reason || 'navigation');
            if(event.data && event.data.type === 'studio-dirty-state') {
                const pageId = String(event.data.pageId || '').replace(/^frame-/, '');
                const frame = document.getElementById('frame-' + pageId);
                if(frame) frame.dataset.studioDirty = event.data.dirty ? '1' : '0';
            }
            forwardStudioApiChange(event.data);
            forwardShortcutSettingsChange(event.data);
        });

        try {
            const studioApiChannel = new BroadcastChannel('studio-api');
            studioApiChannel.onmessage = event => forwardStudioApiChange(event.data);
        } catch(e) {}
        try {
            const studioShortcutChannel = new BroadcastChannel('shiyin-shortcuts');
            studioShortcutChannel.onmessage = event => forwardShortcutSettingsChange(event.data);
        } catch(e) {}

        function prepareStudioBoot() {
            const message = document.getElementById('studio-boot-message');
            const retry = document.getElementById('studio-boot-retry');
            if(message) message.textContent = '正在准备创作空间…';
            if(retry) retry.hidden = true;
            document.documentElement.classList.add('studio-route-booting');
        }

        function finishStudioBoot() {
            document.documentElement.classList.remove('studio-route-booting');
            window.setTimeout(() => {
                const screen = document.getElementById('studio-boot-screen');
                if(screen) screen.hidden = true;
            }, 220);
        }

        function showStudioBootError(error) {
            const message = document.getElementById('studio-boot-message');
            const retry = document.getElementById('studio-boot-retry');
            const detail = String(error?.message || error || '本地服务暂时不可用');
            if(message) message.textContent = `${detail}，请重试`;
            if(retry) retry.hidden = false;
        }

        function retryStudioBoot() {
            if(studioBootInFlight) return;
            prepareStudioBoot();
            restoreActivePage();
        }

        async function loadStudioAccount() {
            const controller = new AbortController();
            const timeout = window.setTimeout(() => controller.abort(), STUDIO_BOOT_TIMEOUT_MS);
            try {
                const response = await fetch('/api/account/me', {cache:'no-store', signal:controller.signal});
                if(response.status === 401) {
                    location.replace('/login');
                    throw new Error('登录会话已失效');
                }
                const data = await response.json().catch(() => ({}));
                if(!response.ok || !data.account) throw new Error(data.detail || '无法读取当前账号');
                currentStudioAccount = data.account;
                document.documentElement.dataset.accountRole = currentStudioAccount.role || 'user';
                document.querySelectorAll('[data-admin-only]').forEach(element => {
                    element.hidden = !currentStudioAccount.is_admin;
                });
                updateAccountLogoutText();
                return currentStudioAccount;
            } catch(error) {
                if(error?.name === 'AbortError') throw new Error('本地服务响应超时');
                throw error;
            } finally {
                window.clearTimeout(timeout);
            }
        }

        function updateAccountLogoutText() {
            const logoutText = document.getElementById('account-logout-text');
            if(!logoutText || !currentStudioAccount) return;
            const prefix = window.StudioI18n?.lang?.() === 'en' ? 'Sign out' : '退出';
            logoutText.textContent = `${prefix} ${currentStudioAccount.account}`;
        }

        async function logoutStudioAccount() {
            try { await fetch('/api/account/logout', {method:'POST'}); }
            finally {
                await window.ShiyinMediaCache?.clear?.();
                location.replace('/login');
            }
        }

        async function restoreActivePage() {
            if(studioBootInFlight) return;
            studioBootInFlight = true;
            restoreSidebarPinned();
            try {
                await loadStudioAccount();
            } catch(error) {
                console.error(error);
                showStudioBootError(error);
                studioBootInFlight = false;
                return;
            }
            const remembered = localStorage.getItem(ACTIVE_PAGE_KEY);
            const id = PAGE_IDS.includes(remembered) && (!ADMIN_PAGE_IDS.has(remembered) || currentStudioAccount.is_admin)
                ? remembered
                : DEFAULT_PAGE_ID;
            restoreSidebarSettings(id);
            const trigger = document.querySelector(`[onclick*="'${id}'"],[onclick*='"${id}"']`);
            switchUI(trigger, id, { skipRemember:true });
            // 只为当前入口页等待一次就绪，避免启动后看到空白舞台；超时后仍解除遮罩，
            // 页面自身的错误态和重试逻辑继续负责后续反馈，不把启动流程永久卡住。
            const activeFrame = document.getElementById('frame-' + id);
            await waitForStudioFrame(activeFrame);
            finishStudioBoot();
            preloadStudioFrames(id);
            studioBootInFlight = false;
            if(currentStudioAccount.is_admin) {
                ensureShiyingApiKeyOnboarding();
                checkForUpdates();
            }
        }
        document.addEventListener('DOMContentLoaded', restoreActivePage, { once:true });

        const host = window.location.host;
        if (host) {
            const handleRealtimeMessage = (data) => {
                if (data.type === 'stats') {
                    const ov = document.getElementById('online-val');
                    if (ov) ov.innerText = data.online_count;
                } else if (data.type === 'cloud_status') {
                    const iframe = document.querySelector('iframe.active');
                    if (iframe && iframe.contentWindow) {
                        iframe.contentWindow.postMessage(data, '*');
                    }
                } else if (data.type === 'canvas_updated') {
                    const iframe = document.querySelector('iframe.active');
                    if (iframe && iframe.contentWindow) {
                        iframe.contentWindow.postMessage(data, '*');
                    }
                } else if (data.type === 'asset_library_updated') {
                    document.querySelectorAll('iframe').forEach(iframe => {
                        if (iframe && iframe.contentWindow) iframe.contentWindow.postMessage(data, '*');
                    });
                } else if (data.type === 'entity.changed') {
                    document.querySelectorAll('iframe').forEach(iframe => {
                        if (iframe && iframe.contentWindow) iframe.contentWindow.postMessage(data, '*');
                    });
                }
            };
            window.addEventListener('canvas-realtime-message', event => handleRealtimeMessage(event.detail || {}));
        }

        // --- 夜间模式 ---

        function versionParts(value) {
            return String(value || '').match(/\d+/g)?.map(Number) || [];
        }

        function compareVersions(a, b) {
            const aa = versionParts(a);
            const bb = versionParts(b);
            const len = Math.max(aa.length, bb.length);
            for(let i = 0; i < len; i++){
                const diff = (aa[i] || 0) - (bb[i] || 0);
                if(diff) return diff;
            }
            return String(a || '').trim() === String(b || '').trim() ? 0 : 1;
        }

        function compactVersion(value) {
            const text = String(value || '').trim();
            const parts = text.match(/\d+/g) || [];
            if(parts.length >= 3) return `${parts[1]}.${parts[2]}`;
            return text.replace(/^v/i, '') || '-';
        }

        function versionLabel(value, mode = 'full') {
            const text = String(value || '').trim();
            if(!text) return 'v-';
            return mode === 'compact' ? `v${compactVersion(text)}` : `v${text.replace(/^v/i, '')}`;
        }

        function describeNetworkError(err, isEn){
            const msg = String(err?.message || err || '');
            const isNetwork = (err instanceof TypeError) || /Failed to fetch|NetworkError|ERR_|timed? ?out|超时|无法连接|GitHub|HTTP 4|HTTP 5/i.test(msg);
            if(isNetwork){
                return isEn
                    ? 'Cannot reach the selected update source. Check your network, proxy, or DNS, then try again.'
                    : '无法连接当前选择的更新源。请检查网络、代理或 DNS 后重试。';
            }
            return msg || (isEn ? 'Update failed' : '更新失败');
        }

        function sourceConnectivityStats(source, results = []) {
            const sourceItems = (results || []).filter(item => item.source === source);
            const required = sourceItems.filter(item => item.required);
            const okRequired = required.length ? required.every(item => item.ok) : false;
            const okItems = sourceItems.filter(item => item.ok);
            const avg = okItems.length
                ? Math.round(okItems.reduce((sum, item) => sum + Number(item.elapsed_ms || 0), 0) / okItems.length)
                : 999999;
            return {source, ok:okRequired, avg, okItems:okItems.length, total:sourceItems.length};
        }

        function bestUpdateSourceFromConnectivity(data) {
            const results = data?.results || [];
            const github = sourceConnectivityStats('github', results);
            const ms = sourceConnectivityStats('modelscope', results);
            if(github.ok && ms.ok) return ms.avg < github.avg ? 'modelscope' : 'github';
            if(ms.ok) return 'modelscope';
            if(github.ok) return 'github';
            return updateSource;
        }

        function renderConnectivityList(results = []) {
            const allItems = results.length ? results : updateConnectivityTargets().map(item => ({...item, pending:false, untouched:true}));
            const renderInto = (list, source) => {
                if(!list) return;
                list.replaceChildren();
                const items = allItems.filter(item => item.source === source || (source === 'github' && item.source === 'reference'));
                items.forEach(item => {
                const row = document.createElement('div');
                row.className = `connectivity-row ${item.pending ? 'pending' : item.untouched ? '' : item.ok ? 'ok' : 'fail'}`;
                const indicator = document.createElement('span');
                indicator.className = 'connectivity-indicator';
                const meta = document.createElement('div');
                const name = document.createElement('div');
                name.className = 'connectivity-name';
                name.textContent = updateTargetLabel(item.name);
                const url = document.createElement('div');
                url.className = 'connectivity-url';
                url.textContent = item.url || '';
                meta.append(name, url);
                const status = document.createElement('div');
                status.className = 'connectivity-status';
                status.textContent = item.untouched ? updateUiText('待测试', 'Not tested') : updateStatusLabel(item);
                row.append(indicator, meta, status);
                if(item.error && !item.timed_out) {
                    const error = document.createElement('div');
                    error.className = 'connectivity-error';
                    error.textContent = String(item.error).slice(0, 220);
                    row.append(error);
                }
                list.append(row);

            renderInto(document.querySelector('[data-connectivity-source="github"]'), 'github');

                `This updates main.py, VERSION, and static files from ${sourceName}. A backup is created first, then the backend restarts automatically. Current ${versionLabel(localVersion)}, latest ${versionLabel(remoteVersion || localVersion)}.`

                );

                setUpdateSummary(

                    updateUiText('需要重启后端', 'Backend restart required'),

                        'The page is updated, but the backend is still the old version and cannot find the connectivity-test API. Restart the service and try again.'
                    )
                );
            } else if((updateConnectivityResult.sources || {})[updateSource]?.ok || (updateSource === 'github' && updateConnectivityResult.ok)) {
                const google = (updateConnectivityResult.results || []).find(item => item.name === 'Google 连通性');
                const sourceResults = (updateConnectivityResult.results || []).filter(item => item.source === updateSource);
                const fastest = sourceResults.filter(item => item.ok).sort((a, b) => (a.elapsed_ms || 999999) - (b.elapsed_ms || 999999))[0];
                setUpdateSummary(
                    google?.ok ? 'ok' : 'warn',
                    updateUiText(`${sourceName} 下载源可用`, `${sourceName} source reachable`),
                    fastest
                        ? updateUiText(`${sourceName} 可访问，最快节点约 ${fastest.elapsed_ms || 0}ms，可以开始更新。`, `${sourceName} is reachable; fastest endpoint is about ${fastest.elapsed_ms || 0}ms.`)
                        : updateUiText(`${sourceName} 更新节点可用，可以开始更新。`, `${sourceName} update endpoints are reachable.`)
                );

                    )
                );
            }
            renderConnectivityList(updateConnectivityResult?.results || []);
        }

        function computeConnectivitySources(results) {
            const out = {};
            for(const source of ['github', 'modelscope']) {
                const reqAll = (results || []).filter(it => it.source === source && it.required);
                out[source] = {
                    ok: reqAll.length > 0 && reqAll.every(it => it.ok),
                    required: reqAll.map(it => it.name),
                };
            }
            return out;
        }

        function setSourceBadge(badge, state, text) {
            if(!badge) return;
            badge.classList.remove('ok', 'bad');
            if(state) badge.classList.add(state);
            badge.textContent = text;
        }

        function renderSourceBadgesLive(results) {
            document.querySelectorAll('[data-update-source]').forEach(card => {
                const source = card.dataset.updateSource || 'github';
                const badge = card.querySelector('.update-source-badge');
                if(!badge) return;
                const items = (results || []).filter(it => it.source === source);
                if(!items.length) return;
                const done = items.filter(it => !it.pending && !it.untouched);
                if(done.length < items.length) {
                    setSourceBadge(badge, '', updateUiText(`检测中 ${done.length}/${items.length}`, `${done.length}/${items.length}`));
                    return;
                }
                const stats = sourceConnectivityStats(source, results);
                setSourceBadge(badge, stats.ok ? 'ok' : 'bad',
                    stats.ok ? updateUiText('可用', 'Available') : updateUiText('不可用', 'Unavailable'));
            });
        }

        let connectivityTesting = false;
        async function runUpdateConnectivityTest() {
            if(connectivityTesting) return; // 防止重复点击导致状态错乱
            const isEn = window.StudioI18n?.lang?.() === 'en';
            const btn = document.getElementById('connectivity-test-btn');
            const text = document.getElementById('connectivity-test-text');
            connectivityTesting = true;
            if(btn) btn.disabled = true;
            if(text) text.textContent = isEn ? 'Testing...' : '检测中...';
            updateConnectivityResult = null;

            const targets = updateConnectivityTargets();
            // 实时状态数组：先全部置为「检测中」，每条探测完成立即刷新对应行
            const live = targets.map(item => ({...item, pending:true, untouched:false}));
            let backendMissing = false;
            const applyResult = (name, patch) => {
                const i = live.findIndex(x => x.name === name);
                if(i < 0) return;
                live[i] = {...live[i], pending:false, untouched:false, ...patch};
                renderConnectivityList(live);
                renderSourceBadgesLive(live);
            };

            const probeOne = async (t) => {
                // 客户端兜底超时：5s 探测 + 1s 网络余量，超时即报「超时」，不会永远卡在「检测中」
                const ac = new AbortController();
                const killer = setTimeout(() => ac.abort(), 6000);
                try {
                    const res = await fetch(`/api/update-connectivity/probe?name=${encodeURIComponent(t.name)}`, { cache:'no-store', signal:ac.signal });
                    const data = await res.json().catch(() => ({}));
                    // 旧后端没有单条探测接口 → 404 Not Found，标记后回退到整体接口
                    if(res.status === 404 && (data.detail === 'Not Found' || data.detail === undefined)) {
                        backendMissing = true;
                        return;
                    }
                    if(res.ok) {
                        applyResult(t.name, { ok:!!data.ok, status:data.status || 0, elapsed_ms:data.elapsed_ms || 0, error:data.error || '', timed_out:!!data.timed_out });
                    } else {
                        applyResult(t.name, { ok:false, error:data.detail || (isEn ? 'Failed' : '失败') });
                    }
                } catch(e) {
                    if(e && e.name === 'AbortError') {
                        applyResult(t.name, { ok:false, timed_out:true, error:isEn ? 'Timed out (over 5s)' : '连接超时（超过 5s）' });
                    } else {
                        applyResult(t.name, { ok:false, error:describeNetworkError(e, isEn) });
                    }
                } finally {
                    clearTimeout(killer);
                }
            };

            try {
                setUpdateSummary('warn', isEn ? 'Testing connectivity' : '正在测试连通性', isEn ? 'Probing each endpoint — results stream in live.' : '正在逐条检测各节点，结果实时显示。');
                renderConnectivityList(live);
                renderSourceBadgesLive(live);
                await Promise.all(targets.map(probeOne));

                if(backendMissing) {
                    // 兜底：尝试旧的整体接口
                    try {
                        const res = await fetch('/api/update-connectivity', { cache:'no-store' });
                        const data = await res.json().catch(() => ({}));
                        if(res.ok && Array.isArray(data.results)) {
                            updateConnectivityResult = data;
                            setUpdateSource(bestUpdateSourceFromConnectivity(data));
                            return;
                        }
                    } catch(e) {}
                    const message = isEn
                        ? 'The backend has not loaded the new connectivity-test API yet. Restart the backend service, then test again.'
                        : '后端还没有加载新的连通性测试接口。请重启服务后再测试。';
                    updateConnectivityResult = {
                        ok:false,
                        backend_missing:true,
                        results:targets.map(item => ({...item, ok:false, elapsed_ms:0, error:message })),
                    };
                    return;
                }

                const results = live.map(({pending, untouched, ...rest}) => rest);
                const sources = computeConnectivitySources(results);
                updateConnectivityResult = { results, sources, ok:sources.github.ok };
                setUpdateSource(bestUpdateSourceFromConnectivity(updateConnectivityResult));
            } finally {
                connectivityTesting = false;
                if(btn) btn.disabled = false;
                refreshProjectUpdateModalText();
            }
        }

        async function confirmProjectUpdate() {
            const isEn = window.StudioI18n?.lang?.() === 'en';
            const btn = document.getElementById('update-now-btn');
            const text = document.getElementById('update-now-text');
            const confirmBtn = document.getElementById('project-update-confirm-btn');
            const confirmText = document.getElementById('project-update-confirm-text');
            const testBtn = document.getElementById('connectivity-test-btn');
            const oldText = text?.textContent || '';
            projectUpdateRunning = true;
            if(btn) btn.disabled = true;
            if(confirmBtn) confirmBtn.disabled = true;
            if(testBtn) testBtn.disabled = true;
            if(text) text.textContent = isEn ? 'Updating...' : '更新中...';
            if(confirmText) confirmText.textContent = isEn ? 'Updating...' : '更新中...';
            const sourceName = updateSourceLabel();
            setUpdateSummary('warn', isEn ? 'Updating' : '正在更新', isEn ? `Downloading files from ${sourceName} and creating a local backup.` : `正在从 ${sourceName} 下载文件，并创建本地备份。`);
            // 客户端兜底超时：即使后端异常挂起，UI 也能恢复，不会永远停在「更新中」
            const ac = new AbortController();
            const killer = setTimeout(() => ac.abort(), 300000);
            try {
                const res = await fetch('/api/update-from-github', {
                    method:'POST',
                    headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({ auto_restart:true, restart_delay:3, source:updateSource, fallback:true }),
                    signal:ac.signal
                });
                const data = await res.json().catch(() => ({}));
                if(!res.ok) throw new Error(data.detail || (isEn ? 'Update failed' : '更新失败'));
                if(data.update_notes) setProjectUpdateNotes(data.update_notes);
                const restarting = data.restart_scheduled;
                const usedLabel = data.source_label || (data.source === 'modelscope' ? 'ModelScope' : 'GitHub');
                const fallbackNote = data.fallback_used
                    ? (isEn
                        ? ` (${sourceName} was unreachable, so it fell back to ${usedLabel})`
                        : `（${sourceName} 不可用，已自动兜底切换到 ${usedLabel}）`)
                    : '';
                setUpdateSummary(
                    'ok',
                    isEn ? 'Update complete' : '更新完成',
                    (restarting
                        ? (isEn
                            ? `Updated ${data.count || 0} files. The backend will restart in about 3 seconds; this page will reload when it returns.`
                            : `已更新 ${data.count || 0} 个文件。后端将在约 3 秒后自动重启，本页面会在恢复后自动刷新。`)
                        : (isEn
                            ? `Updated ${data.count || 0} files. Please restart the backend, then refresh this page.`
                            : `已更新 ${data.count || 0} 个文件。请重启后端，然后刷新页面。`)) + fallbackNote
                );
                document.getElementById('github-entry-btn')?.classList.remove('update-available');
                btn?.classList.remove('show');
                setProjectVersionBadge(data.version || document.getElementById('github-entry-btn')?.dataset.remoteVersion || appInfo.version);
                if(restarting) waitForBackendAndReload();
            } catch(e) {
                const msg = (e && e.name === 'AbortError')
                    ? (isEn ? 'Update timed out. Switch source or check your network, then retry.' : '更新超时。请切换下载源或检查网络后重试。')
                    : describeNetworkError(e, isEn);
                setUpdateSummary('fail', isEn ? 'Update failed' : '更新失败', msg);
            } finally {
                clearTimeout(killer);
                projectUpdateRunning = false;
                if(btn) btn.disabled = false;
                if(confirmBtn) confirmBtn.disabled = false;
                if(testBtn) testBtn.disabled = false;
                if(text) text.textContent = oldText || (isEn ? 'Update' : '一键更新');
                if(confirmText) confirmText.textContent = isEn ? 'Start update' : '开始更新';
                refreshUpdateButtonText();
            }
        }
        async function waitForBackendAndReload() {
            const deadline = Date.now() + 90 * 1000;
            await new Promise(r => setTimeout(r, 4000));
            while(Date.now() < deadline) {
                try {
                    const r = await fetch('/api/app-info', { cache:'no-store' });
                    if(r.ok) { location.reload(); return; }
                } catch {}
                await new Promise(r => setTimeout(r, 1500));
            }
        }
        async function rollbackProjectUpdate() {
            const isEn = window.StudioI18n?.lang?.() === 'en';
            try {
                const list = await fetch('/api/update-backups').then(r => r.json());
                const backups = list.backups || [];
                if(!backups.length){ alert(isEn ? 'No backups available.' : '没有可用的备份'); return; }
                const lines = backups.slice(0, 8).map((b, i) => {
                    const d = new Date((b.created_at || 0) * 1000);
                    const ts = d.toLocaleString();
                    return `${i + 1}. ${b.name}  (${b.file_count} files, ${ts})`;
                });
                const promptMsg = (isEn
                    ? 'Select a backup to restore (enter the number):\n'
                    : '选择要还原的备份（输入序号）：\n') + lines.join('\n');
                const answer = prompt(promptMsg, '1');
                const idx = Number(answer) - 1;
                if(!(idx >= 0 && idx < backups.length)) return;
                const target = backups[idx];
                if(!confirm(isEn ? `Restore "${target.name}"? Backend will restart.` : `要还原 "${target.name}" 吗？后端会自动重启。`)) return;
                const res = await fetch('/api/update-rollback', {
                    method:'POST',
                    headers:{'Content-Type':'application/json'},
                    body:JSON.stringify({ name:target.name, auto_restart:true, restart_delay:3 })
                });
                const data = await res.json().catch(() => ({}));
                if(!res.ok) throw new Error(data.detail || (isEn ? 'Rollback failed' : '回滚失败'));
                alert(isEn
                    ? `Restored ${data.count || 0} files. Backend is restarting.`
                    : `已还原 ${data.count || 0} 个文件。后端正在重启。`);
                if(data.restart_scheduled) waitForBackendAndReload();
            } catch(e) {
                alert((isEn ? 'Rollback failed: ' : '回滚失败：') + describeNetworkError(e, isEn));
            }
        }
        window.rollbackProjectUpdate = rollbackProjectUpdate;

        async function checkForUpdates(manual = false) {
            const isEn = window.StudioI18n?.lang?.() === 'en';
            const badge = document.getElementById('project-version-badge');
            if(manual && badge) badge.classList.add('checking');
            try {
                const info = await fetch('/api/app-info', { cache:'no-store' }).then(r => r.json()).catch(() => ({}));
                appInfo = {...appInfo, ...info};
                let current = String(appInfo.version || '').trim();
                setProjectVersionBadge(current);
                setProductIdentity(current);
                let best = null;
                let reachable = false;
                let serverChecked = false;
                // 优先走后端检测：服务端用系统代理同时检测 GitHub 和 ModelScope，避免浏览器跨域/被墙
                try {
                    const r = await fetch('/api/check-update', { cache:'no-store' });
                    if(r.ok) {
                        const d = await r.json();
                        serverChecked = true;
                        reachable = !!d.reachable;
                        if(d.current) { current = String(d.current).trim(); setProjectVersionBadge(current); setProductIdentity(current); }
                        if(d.latest?.version) best = {source:d.latest.source, version:d.latest.version, update_notes:d.latest.update_notes || d.update_notes || null};
                    }
                } catch(e) {}
                // 兜底：旧后端无 /api/check-update 时，浏览器直接拉取双源 VERSION
                if(!serverChecked) {
                    const sources = appInfo.sources || {};
                    const candidates = [
                        {source:'github', url:sources.github?.version_url || appInfo.version_url || ''},
                        {source:'modelscope', url:sources.modelscope?.version_url || ''},
                    ].filter(item => item.url);
                    for(const item of candidates) {
                        try {
                            const remoteText = await fetch(`${item.url}${item.url.includes('?') ? '&' : '?'}t=${Date.now()}`, { cache:'no-store' }).then(r => r.ok ? r.text() : '');
                            const remote = String(remoteText || '').trim().split(/\r?\n/)[0].trim();
                            if(remote){ reachable = true; if(!best || compareVersions(remote, best.version) > 0) best = {source:item.source, version:remote}; }
                        } catch(e) {}
                    }
                }
                const hasUpdate = !!(current && best?.version && compareVersions(best.version, current) > 0);
                if(hasUpdate) {
                    if(best.source === 'modelscope') setUpdateSource('modelscope');
                    setProjectUpdateNotes(best.update_notes || null);
                    showUpdateNotice(current, best.version);
                }
                if(manual) {
                    if(hasUpdate) {
                        openProjectUpdateModal();
                    } else if(reachable) {
                        alert(isEn ? `You are on the latest version (${versionLabel(current)}).` : `已是最新版本（${versionLabel(current)}）。`);
                    } else {
                        alert(isEn ? 'Could not reach GitHub or ModelScope. Check your network/proxy and try again.' : '无法连接 GitHub 或 ModelScope 更新源，请检查网络或代理后重试。');
                    }
                }
            } catch(e) {
                // 离线包里没有网络时保持安静，不影响本地使用。
                if(manual) alert(isEn ? 'Update check failed.' : '检测更新失败。');
            } finally {
                if(badge) badge.classList.remove('checking');
            }
        }
    </script>
