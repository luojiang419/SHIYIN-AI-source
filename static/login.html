<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>登录 SHIYIN AI</title>
  <style>
    :root{font-family:Inter,"Microsoft YaHei",system-ui,sans-serif;color-scheme:light;background:#f3f0ea;color:#24211e}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 12%,#fff 0,#f3f0ea 48%,#e5ded3 100%)}
    main{width:min(440px,100%);padding:30px;border:1px solid #d5ccbf;border-radius:20px;background:rgba(255,255,255,.94);box-shadow:0 28px 80px rgba(72,58,43,.16)}
    .brand{display:flex;gap:13px;align-items:center}.mark{display:grid;place-items:center;width:44px;height:44px;border-radius:13px;background:#3b3732;color:#fff;font-weight:800;font-size:20px}
    h1{margin:0 0 5px;font-size:23px}p{margin:0;color:#746b61;font-size:13px;line-height:1.6}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:25px 0 4px;padding:4px;border-radius:12px;background:#eee8df}
    .tab{border:0;border-radius:9px;padding:10px;background:transparent;color:#70675d;font-weight:700;cursor:pointer}.tab.active{background:#fff;color:#25211d;box-shadow:0 2px 10px rgba(72,58,43,.1)}
    label{display:block;margin-top:17px;font-size:13px;font-weight:650;color:#49423b}input{width:100%;margin-top:7px;padding:13px;border:1px solid #d4cabd;border-radius:11px;background:#fff;color:#24211e;font:inherit;outline:none}input:focus{border-color:#776a5b;box-shadow:0 0 0 3px rgba(119,106,91,.14)}
    button.submit{width:100%;margin-top:21px;padding:13px;border:0;border-radius:11px;background:#3b3732;color:#fff;font:700 15px/1.2 inherit;cursor:pointer}button:disabled{opacity:.55;cursor:wait}
    #message{min-height:22px;margin-top:13px;text-align:center}.error{color:#b42334}.success{color:#247449}.note{margin-top:20px;padding-top:16px;border-top:1px solid #e5ddd3;font-size:12px}
  </style>
</head>
<body>
  <main>
    <div class="brand"><div class="mark">S</div><div><h1>SHIYIN AI</h1><p>每个账号拥有独立的画布、素材和生成资源</p></div></div>
    <div class="tabs"><button class="tab active" data-mode="login">登录</button><button class="tab" data-mode="register">自动注册</button></div>
    <form id="form">
      <label>账号<input id="account" inputmode="text" autocomplete="username" required placeholder="中文、英文字母或数字"></label>
      <label>密码<input id="password" type="password" inputmode="text" autocomplete="current-password" required placeholder="任意字符，不能为空"></label>
      <button class="submit" id="submit" type="submit">登录</button>
    </form>
    <p id="message" aria-live="polite"></p>
    <p class="note" id="note">普通用户输入已注册账号和密码，英文字母大小写视为同一账号。管理员仅可在安装软件的本机登录。</p>
  </main>
  <script>
    let mode='login';
    const form=document.getElementById('form'),account=document.getElementById('account'),password=document.getElementById('password'),submit=document.getElementById('submit'),message=document.getElementById('message'),note=document.getElementById('note');
    document.querySelectorAll('.tab').forEach(tab=>tab.addEventListener('click',()=>{
      mode=tab.dataset.mode;document.querySelectorAll('.tab').forEach(item=>item.classList.toggle('active',item===tab));
      submit.textContent=mode==='register'?'注册并进入':'登录';password.autocomplete=mode==='register'?'new-password':'current-password';
      note.textContent=mode==='register'?'账号可使用中文、英文字母和数字；密码不限制长度或复杂度，但不能为空。注册后数据将保存到独立账户目录。':'普通用户输入已注册账号和密码，英文字母大小写视为同一账号。管理员仅可在安装软件的本机登录。';message.textContent='';
    }));
    form.addEventListener('submit',async event=>{
      event.preventDefault();submit.disabled=true;message.className='';message.textContent=mode==='register'?'正在创建独立账户…':'正在登录…';
      try{
        const response=await fetch(`/api/account/${mode}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({account:account.value,password:password.value})});
        const data=await response.json().catch(()=>({}));if(!response.ok)throw new Error(data.detail||`请求失败 (${response.status})`);
        message.className='success';message.textContent=mode==='register'?'注册成功，正在进入…':'登录成功，正在进入…';location.replace('/');
      }catch(error){message.className='error';message.textContent=error.message||String(error);submit.disabled=false;password.select()}
    });
  </script>
</body>
</html>
