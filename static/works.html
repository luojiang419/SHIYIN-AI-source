<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>作品管理</title>
    <script>
        (function(){
            try {
                var theme = localStorage.getItem('studio_theme') || localStorage.getItem('canvas_theme') || 'system';
                if(theme === 'system') theme = window.matchMedia && window.matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light';
                if(theme === 'dark') document.documentElement.classList.add('studio-theme-dark','theme-dark');
                if(theme === 'pure-white') document.documentElement.classList.add('studio-theme-pure-white','theme-pure-white');
            } catch(e) {}
        })();
    </script>
    <script src="/static/js/theme.js?v=2026.07.31.theme-picker.1"></script>
    <script src="/static/js/focus-guard.js?v=2026.08.02.ime-focus.1"></script>
    <script src="/static/js/media-cache-client.js?v=2026.08.30.static-assets-cache.1"></script>
    <script src="/static/js/i18n.js?v=2026.07.26.ecommerce-prompts.1"></script>
    <link rel="stylesheet" href="/static/css/theme.css?v=2026.07.22.1">
    <link rel="stylesheet" href="/static/css/compare-viewer.css?v=2026.07.22.1">
    <link rel="stylesheet" href="/static/css/works.css?v=2026.07.26.bulk-download.1">
    <link rel="stylesheet" href="/static/css/studio-unified.css?v=2026.08.02.ivory-surfaces.1">
</head>
<body>
    <main class="works-page">
        <header class="works-toolbar">
            <div class="works-heading">
                <div class="works-title"><span>WORKS</span><h1 data-i18n="works.title">作品管理</h1><em id="worksCount">0</em></div>
                <nav id="worksTabs" class="works-tabs" aria-label="作品分类">
                    <button class="active" type="button" data-tab="all" data-i18n="works.all">全部作品</button>
                    <button type="button" data-tab="favorite" data-i18n="works.favorites">收藏</button>
                    <button type="button" data-tab="trash" data-i18n="works.trash">回收站</button>
                </nav>
            </div>
            <div id="worksSelectionActions" class="works-selection-actions hidden" role="toolbar" aria-label="批量操作">
                <span id="worksSelectionCount">已选择 0 项</span>
                <button id="worksBatchFavorite" type="button">收藏</button>
                <button id="worksBatchDelete" type="button">删除</button>
                <button id="worksBatchTrash" type="button">移到回收站</button>
                <button id="worksClearSelection" class="secondary" type="button">取消选择</button>
            </div>
            <div class="works-filters">
                <label class="works-search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg><input id="worksSearch" type="search" data-i18n-placeholder="works.search" placeholder="搜索提示词、模型或文件名"></label>
                <select id="worksKind" aria-label="作品类型"><option value="" data-i18n="works.allTypes">全部类型</option></select>
                <div id="worksMediaFilter" class="works-segmented" role="group" aria-label="媒体类型"><button type="button" data-media-type="all">全部</button><button type="button" data-media-type="image">图片</button><button type="button" data-media-type="video">视频</button></div>
                <div id="worksSortOrder" class="works-segmented" role="group" aria-label="排序顺序"><button type="button" data-sort-order="asc">最早优先</button><button type="button" data-sort-order="desc">最新优先</button></div>
                <button id="worksSelectionModeToggle" class="works-selection-toggle" type="button" role="switch" aria-checked="false"><span aria-hidden="true">☐</span>多选</button>
                <button id="worksQuickCompare" class="works-compare-now" type="button" data-i18n="works.compareNow">随时对比</button>
                <button id="worksClearAll" class="works-danger-button" type="button" data-i18n="works.clearAll">清空作品</button>
                <button id="worksRefresh" class="works-icon-button" type="button" data-i18n-title="works.refresh" aria-label="刷新">↻</button>
            </div>
        </header>

        <section id="worksGrid" class="works-grid" aria-live="polite"></section>
        <section id="worksEmpty" class="works-empty hidden"><div>◇</div><h2 data-i18n="works.emptyTitle">还没有作品</h2><p data-i18n="works.emptyHint">生成完成的图片会自动出现在这里</p></section>
        <button id="worksDownloadAll" class="works-download-all" type="button" data-i18n="works.downloadAll">下载全部作品</button>
    </main>

    <dialog id="worksCompareDialog" class="works-compare-dialog">
        <div class="works-compare-shell">
            <header>
                <div><small data-i18n="works.compare">划像对比</small><h2 id="compareWorkName">—</h2></div>
                <div class="works-dialog-actions"><button id="compareFavorite" type="button" aria-label="收藏">☆</button><button id="closeWorksCompare" type="button" aria-label="关闭">×</button></div>
            </header>
            <div class="works-compare-controls">
                <label><span data-i18n="works.targetImage">待核对作品</span><select id="compareTargetSelect"></select></label>
                <button id="compareTargetFileButton" type="button" data-i18n="works.chooseLocalTarget">选择本地作品</button>
                <label><span data-i18n="works.baseImage">对比基准</span><select id="compareBaseSelect"></select></label>
                <button id="compareBaseFileButton" type="button" data-i18n="works.chooseLocalBase">选择本地基准图</button>
                <span id="compareHint" data-i18n="works.compareHint">滚轮缩放；按住鼠标中键拖拽平移</span>
            </div>
            <div id="worksCompareStage" class="works-compare-stage">
                <img id="worksBeforeImage" data-compare-before alt="基准图">
                <div id="worksAfterClip" class="works-after-clip" data-compare-after-clip><img id="worksAfterImage" data-compare-after alt="作品"></div>
                <button id="worksCompareHandle" class="works-compare-handle" data-compare-handle type="button" role="slider" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"><span>‹</span><span>›</span></button>
                <span class="works-compare-label compare-viewer-label before" data-i18n="works.base">基准</span>
                <span class="works-compare-label compare-viewer-label after" data-i18n="works.work">作品</span>
                <div class="works-compare-tools compare-viewer-tools">
                    <button id="worksZoomOut" type="button" data-compare-zoom-out aria-label="缩小">−</button>
                    <button id="worksZoomReset" type="button" data-compare-zoom-label aria-label="复位">1×</button>
                    <button id="worksZoomIn" type="button" data-compare-zoom-in aria-label="放大">＋</button>
                    <button id="worksFullscreen" type="button" data-compare-fullscreen aria-label="全屏"><span class="compare-viewer-fullscreen-enter">⛶</span><span class="compare-viewer-fullscreen-exit">×</span></button>
                </div>
            </div>
            <footer><div id="compareMeta" class="works-compare-meta"></div><button id="compareDownload" type="button" data-i18n="works.download">下载</button></footer>
        </div>
    </dialog>

    <dialog id="worksPreviewDialog" class="works-preview-dialog">
        <div class="works-preview-shell">
            <header>
                <div><small data-i18n="works.preview">作品预览</small><h2 id="worksPreviewName">—</h2></div>
                <div class="works-dialog-actions"><button id="worksPreviewFullscreen" type="button" aria-label="全屏">⛶</button><button id="closeWorksPreview" type="button" aria-label="关闭">×</button></div>
            </header>
            <div id="worksPreviewFrame" class="works-preview-frame">
                <img id="worksPreviewImage" class="studio-preview-img" alt="作品预览" draggable="false">
                <video id="worksPreviewVideo" class="studio-preview-video" controls playsinline hidden></video>
            </div>
            <footer><div id="worksPreviewMeta" class="works-compare-meta"></div><button id="worksPreviewDownload" type="button" data-i18n="works.download">下载</button></footer>
        </div>
    </dialog>

    <input id="compareBaseFile" type="file" accept="image/png,image/jpeg,image/webp" hidden>
    <input id="compareTargetFile" type="file" accept="image/png,image/jpeg,image/webp" hidden>
    <div id="worksToast" class="works-toast" role="status"></div>
    <script src="/static/js/compare-viewer.js?v=2026.07.22.1"></script>
    <script src="/static/js/image-preview.js?v=2026.08.05.works-preview.1"></script>
    <script src="/static/js/works.js?v=2026.08.24.video-playback-directory-fix.1"></script>
</body>
</html>
