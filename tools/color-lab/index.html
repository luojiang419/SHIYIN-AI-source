<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>面料色彩验证台</title><style>body{margin:24px;background:#111822;color:#e7edf6;font:15px system-ui}button,input,select{padding:8px;margin:5px;background:#263447;color:inherit;border:1px solid #567;border-radius:6px}main{display:grid;grid-template-columns:340px 1fr;gap:24px}label{display:block;margin:9px 0}input[type=range]{width:210px}.images{display:flex;gap:12px}.images img{width:32%;object-fit:contain;max-height:640px}pre{white-space:pre-wrap}small{color:#bdc8d6}</style><h1>面料色彩验证台 · 技术原型</h1><p>上传参考面料和生成图 → 选择区域 → 调参验证 → 保存面料档案 → 换一张生成图复验。</p><main><section><label>参考图<input id="ref" type="file" accept="image/*"></label><label>生成图<input id="src" type="file" accept="image/*"></label><label>参考纯布面 ROI<input id="rr" value="0,0,256,256"></label><label>生成纯布面 ROI<input id="sr" value="0,0,256,256"></label><label>生成图应用 ROI<input id="ar" value="0,0,256,256"></label><small>格式 x,y,宽,高，使用原图像素。应用区目前是矩形，请选纯布面作技术验证；不会自动把它标为整件服装合格。</small><label>色彩模型<select id="model"><option value="manual">纯手动 Lab 偏移（固定参数复用）</option><option value="affine">Lab 均值 / 方差</option><option value="quantile">Lab 分位数</option></select></label><div id="controls"></div><button id="run">生成调色预览并测量</button><button id="reset">重置偏移</button><hr><input id="name" placeholder="面料编号 / 名称"><button id="save">保存参数到面料库</button><select id="profiles"><option value="">选择面料档案</option></select><button id="refresh">刷新面料库</button><button id="export">导出当前参数 JSON</button></section><section><p>左：参考图　中：生成原图　右：当前调色结果</p><div class="images"><img id="ri"><img id="si"><img id="oi"></div><p id="status">等待上传图片。</p><pre id="metrics"></pre><a id="download" hidden download="color-preview.png">下载本次结果</a><p>指标只针对填写的布面 ROI；不同姿态的逐像素 DeltaE 不等于真实色卡测量。保存参数不会自动认证稳定性。</p></section></main><script>
const $=id=>document.getElementById(id), spec=[['strength','拟合强度',0,1,.01,1],['lightness','亮度 L*',-25,25,.5,0],['contrast','对比度',.5,1.5,.01,1],['chroma','饱和度',.3,1.8,.01,1],['a_shift','红绿 a*',-30,30,.5,0],['b_shift','黄蓝 b*',-30,30,.5,0]];let reference,source,last,records=[];
$('controls').innerHTML=spec.map(([k,n,a,b,s,v])=>`<label>${n} <output id="${k}v">${v}</output><input id="${k}" type="range" min="${a}" max="${b}" step="${s}" value="${v}"></label>`).join('');
const values=()=>Object.fromEntries([['model',$('model').value],...spec.map(([k])=>[k,Number($(k).value)])]);
function dirty(){last=null;$('status').textContent='参数已变化，请重新生成预览。'}
spec.forEach(([k])=>$(k).oninput=()=>{$(k+'v').value=$(k).value;dirty()});$('model').onchange=dirty;['rr','sr','ar'].forEach(k=>$(k).oninput=dirty);
for(const [k,img] of [['ref','ri'],['src','si']]) $(k).onchange=async()=>{let r=new FileReader();r.onload=()=>{if(k==='ref')reference=r.result;else source=r.result;$(img).src=r.result;dirty()};r.readAsDataURL($(k).files[0])};
const roi=k=>$(k).value.split(',').map(Number);
async function request(url,body){const r=await fetch(url,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}:{});const x=await r.json();if(!r.ok)throw Error(x.error||r.status);return x}
$('run').onclick=async()=>{if(!reference||!source){$('status').textContent='请先上传两张图片';return}const c=values();$('run').disabled=true;$('status').textContent='计算中…';try{const r=await request('/fit',{reference,source,reference_roi:roi('rr'),source_roi:roi('sr'),apply_roi:roi('ar'),controls:c});last={controls:c,metrics:r.after};$('oi').src=r.image;$('download').href=r.image;$('download').hidden=false;$('metrics').textContent=JSON.stringify({前:r.before,后:r.after},null,2);$('status').textContent='预览完成。'+r.path}catch(e){$('status').textContent=e.message}finally{$('run').disabled=false}};
async function refresh(){records=await request('/profiles');$('profiles').replaceChildren(new Option('选择面料档案',''),...records.map((p,i)=>new Option(p.name+' · '+p.status,i)))}
$('refresh').onclick=()=>refresh().catch(e=>$('status').textContent=e.message);$('save').onclick=async()=>{try{if(!last)throw Error('请先用当前参数生成并验证');if(!$('name').value.trim())throw Error('填写面料名称');await request('/profiles',{name:$('name').value.trim(),...last,created_at:new Date().toISOString()});await refresh();$('status').textContent='参数已保存为草稿。换新图加载档案继续验证。'}catch(e){$('status').textContent=e.message}};
$('profiles').onchange=()=>{const p=records[$('profiles').value];if(!p)return;$('name').value=p.name;$('model').value=p.controls.model;spec.forEach(([k])=>{$(k).value=p.controls[k];$(k+'v').value=$(k).value});dirty()};
$('reset').onclick=()=>{spec.forEach(([k,n,a,b,s,v])=>{$(k).value=v;$(k+'v').value=v});dirty()};$('export').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify({name:$('name').value,controls:values(),metrics:last?.metrics},null,2)],{type:'application/json'}));a.download='fabric-profile.json';a.click();URL.revokeObjectURL(a.href)};refresh();
</script></html>
