<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>SHIYIN Depth Batch 正在更新</title>
  <style>
    :root{font-family:"Microsoft YaHei UI","Segoe UI",sans-serif;color:#edf1f5;background:#0d1013}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 80% 0,#1f2b35 0,transparent 36%),#0d1013}main{width:min(650px,calc(100vw - 48px));padding:34px 38px;border:1px solid #343d47;border-radius:16px;background:linear-gradient(145deg,#1d2228,#12161a);box-shadow:0 28px 90px #000b}.brand{color:#8995a1;font-size:11px;letter-spacing:.18em}.brand-row{display:flex;align-items:center;gap:15px}.mark{position:relative;width:45px;height:45px;border:1px solid #596572;border-radius:50%;background:radial-gradient(circle at 36% 32%,#d8e8f4 0 5%,#536270 7%,#151a20 46%);box-shadow:inset 0 0 14px #9fc6df28,0 0 20px #74b8df16}.mark:after{content:"";position:absolute;inset:9px -5px;border:1px solid #91a5b577;border-radius:50%;transform:rotate(-22deg)}h1{margin:7px 0 0;font-size:24px;font-weight:600}#message{margin:22px 0 5px;color:#d5dbe1;font-size:14px}#substep{min-height:20px;margin:0;color:#84909c;font-size:12px}.progress-head{display:flex;align-items:end;justify-content:space-between;margin:27px 0 10px}.progress-head span{display:block;color:#7f8a96;font-size:10px;letter-spacing:.1em}.progress-head strong{display:block;margin-top:5px;font-size:14px}.spinner{width:28px;height:28px;border:3px solid #3b4650;border-top-color:#e4ebf1;border-radius:50%;animation:spin .85s linear infinite}.track{height:9px;overflow:hidden;border:1px solid #36404a;border-radius:99px;background:#090b0d}.fill{width:1%;height:100%;border-radius:inherit;background:#c8d4de;box-shadow:0 0 15px #9ed7ff55;transition:width .35s ease}.fill.success{background:#79bd91}.fill.error{background:#dc7b82}.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:27px 0 0;padding:0;list-style:none}.steps li{position:relative;padding-top:19px;color:#697581;text-align:center;font-size:10px}.steps li:before{content:"";position:absolute;top:0;left:50%;width:8px;height:8px;transform:translateX(-50%);border:1px solid #56616c;border-radius:50%;background:#151a1f}.steps li:not(:last-child):after{content:"";position:absolute;top:4px;left:calc(50% + 8px);width:calc(100% - 16px);height:1px;background:#323a42}.steps li.active,.steps li.done{color:#d7dee5}.steps li.active:before{border-color:#dce5ec;background:#dce5ec;box-shadow:0 0 0 5px #dce5ec1c}.steps li.done:before{border-color:#79bd91;background:#79bd91}.error{display:none;margin-top:20px;padding:12px 14px;border:1px solid #774148;border-radius:8px;background:#321c20;color:#f0a7ab;font-size:12px;white-space:pre-wrap}.error.visible{display:block}@keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main>
    <div class="brand-row"><span class="mark" aria-hidden="true"></span><div><div class="brand">SHIYIN DEPTH BATCH</div><h1>正在更新软件</h1></div></div>
    <div class="progress-head"><div><span>更新进度</span><strong id="stage">准备安装</strong></div><i id="spinner" class="spinner" aria-label="正在更新"></i></div>
    <div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="1"><div id="fill" class="fill"></div></div>
    <p id="message">正在启动独立更新器…</p><p id="substep">请勿关闭此窗口。</p>
    <ol class="steps"><li>准备安装</li><li>关闭旧版本</li><li>安装新版本</li><li>启动新版本</li><li>完成</li></ol>
    <div id="error" class="error"></div>
  </main>
  <script>
    (()=>{const invoke=window.__TAURI__?.core?.invoke||window.__TAURI_INTERNALS__?.invoke,listen=window.__TAURI__?.event?.listen;const steps=[...document.querySelectorAll('.steps li')],stage=document.querySelector('#stage'),fill=document.querySelector('#fill'),track=document.querySelector('.track'),message=document.querySelector('#message'),substep=document.querySelector('#substep'),error=document.querySelector('#error'),spinner=document.querySelector('#spinner');function render(event){const data=event?.payload||event||{},index=Number(data.stepIndex||0),percent=Math.max(1,Math.min(100,Number(data.progressPercent)||1));fill.style.width=percent+'%';track.setAttribute('aria-valuenow',String(percent));stage.textContent=data.stepLabel||'更新中';message.textContent=data.message||'正在更新…';substep.textContent=data.substep||'';steps.forEach((item,i)=>{item.classList.toggle('active',i===index&&!data.isSuccess&&!data.isError);item.classList.toggle('done',i<index||data.isSuccess)});fill.classList.toggle('success',Boolean(data.isSuccess));fill.classList.toggle('error',Boolean(data.isError));if(data.isSuccess)spinner.style.animationDuration='1.8s';if(data.isError){spinner.style.animationPlayState='paused';error.textContent=data.message||'更新失败，请重新打开软件后重试。';error.classList.add('visible')}}async function start(){if(!invoke){render({stepIndex:0,progressPercent:1,stepLabel:'更新失败',message:'独立更新器环境不可用。',isError:true});return}if(listen)await listen('depth-batch-update-progress',render);try{await invoke('run_depth_batch_update_session')}catch(e){render({stepIndex:0,progressPercent:1,stepLabel:'更新失败',message:String(e),substep:'请重新打开软件后重试。',isError:true})}}start()})();
  </script>
</body>
</html>
