[package]
name = "shiyin-video-depth-lab"
version = "0.1.0"
description = "SHIYIN AI video depth model validation workbench"
authors = ["SHIYIN AI contributors"]
edition = "2021"
license-file = "../../../LICENSE"

[[bin]]
name = "SHIYIN-Video-Depth-Lab"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
rfd = { version = "0.15.4", features = ["common-controls-v6"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.5", features = ["protocol-asset"] }

[dev-dependencies]
tempfile = "3.23.0"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
