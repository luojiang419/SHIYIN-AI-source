[package]
name = "shiyin-video-depth-lab"
version = "1.0.4"
description = "SHIYIN AI video depth model validation workbench"
authors = ["SHIYIN AI contributors"]
edition = "2021"
license-file = "../../../LICENSE"

[[bin]]
name = "SHIYIN-Video-Depth-Lab"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
encoding_rs = "0.8"
rfd = { version = "0.15.4", features = ["common-controls-v6"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.5", features = ["protocol-asset"] }
tauri-plugin-single-instance = "2.3.6"
sha2 = "0.10.9"
ed25519-dalek = "2.2"
ureq = { version = "3.1.4", features = ["json"] }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell"] }

[dev-dependencies]
tempfile = "3.23.0"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
panic = "abort"
strip = true
