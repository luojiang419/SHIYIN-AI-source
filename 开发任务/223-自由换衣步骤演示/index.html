<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>正在打开自由换衣页面</title>
</head>
<body>
  <p>正在打开电商专用 · 自由换衣演示。<a id="openDemo" href="http://127.0.0.1:8766/demo/tryon?step=1">点击这里手动打开</a></p>
  <script>
    const value = Number(new URLSearchParams(location.search).get('step') || 1);
    const step = Number.isFinite(value) ? Math.max(1, Math.min(4, Math.trunc(value))) : 1;
    const target = `http://127.0.0.1:8766/demo/tryon?step=${step}`;
    document.getElementById('openDemo').href = target;
    location.replace(target);
  </script>
</body>
</html>
