<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>自由换衣 · 四步真实页面演示</title>
  <style>
    :root{color-scheme:dark;font-family:system-ui,"Microsoft YaHei",sans-serif;background:#151515;color:#f5f3ef}
    *{box-sizing:border-box}body{margin:0;padding:24px}main{max-width:1640px;margin:auto}
    header{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin-bottom:22px}
    small{color:#b6a486;font-size:12px;font-weight:800;letter-spacing:.18em}h1{margin:8px 0;font-size:28px}
    p{color:#a9a6a1;line-height:1.6;margin:0}.badge{border:1px solid #514735;border-radius:99px;padding:8px 12px;color:#dbbe92;font-size:12px;white-space:nowrap}
    nav{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}
    nav button,.controls button{border:1px solid #373737;background:#222;color:#eee;border-radius:12px;padding:14px;cursor:pointer;font:inherit;text-align:left}
    nav button.active{border-color:#a66d38;background:#332719}nav button b{color:#c98f59;margin-right:8px}
    figure{margin:0;border:1px solid #343434;border-radius:20px;overflow:hidden;background:#202020;box-shadow:0 24px 70px #0007}
    figure img{display:block;width:100%;height:auto}figcaption{padding:15px 18px;color:#c9c5bf;font-size:13px}
    .controls{display:flex;justify-content:space-between;gap:12px;margin:16px 0}.controls button{min-width:110px;text-align:center}
    .controls button:disabled{opacity:.4;cursor:not-allowed}footer{font-size:12px;color:#8f8d89;padding:4px 0 20px}
    @media(max-width:700px){body{padding:12px}header{display:block}h1{font-size:21px}.badge{display:inline-block;margin-top:12px}nav{grid-template-columns:repeat(2,1fr)}nav button{padding:11px}}
  </style>
</head>
<body>
  <main>
    <header><div><small>SHIYIN AI / FREE TRY-ON</small><h1>自由换衣 · 四步真实页面演示</h1><p>依次查看人物、服饰、调整、生成。图片来自实际页面操作与本地后端上传、分析接口。</p></div><span class="badge">真实页面截图 · 非设计稿</span></header>
    <nav id="steps" aria-label="演示步骤"></nav>
    <figure><img id="preview" alt="自由换衣步骤截图"><figcaption id="caption"></figcaption></figure>
    <div class="controls"><button id="previous" type="button">← 上一步</button><button id="next" type="button">下一步 →</button></div>
    <footer>演示素材为生成的虚构参考图。第 4 步提示词由真实分析接口返回；隔离环境未配置图片生成 API，因此没有把试穿结果或指南图伪装成已生成。</footer>
  </main>
  <script>
    const steps=[
      {name:'人物',file:'01-人物.png',caption:'上传人物全身参考图，确定身份、体型和肤色。完成后解锁服饰步骤。'},
      {name:'服饰',file:'02-服饰.png',caption:'上装、下装和鞋靴分别上传；右侧搭配托盘同步显示已选服饰。'},
      {name:'调整',file:'03-调整.png',caption:'补充动作参考与面料局部，并把面料细节归属到对应上装。'},
      {name:'生成',file:'04-生成.png',caption:'实际调用分析接口，按参考图角色生成可审阅的提示词；下方可补充生成需求。'}
    ];
    let current=Math.max(0,Math.min(3,Number(new URLSearchParams(location.search).get('step')||1)-1));
    const nav=document.getElementById('steps'),img=document.getElementById('preview'),caption=document.getElementById('caption');
    function show(index){current=Math.max(0,Math.min(steps.length-1,index));const item=steps[current];img.src=encodeURI(item.file);img.alt=`第 ${current+1} 步：${item.name}`;caption.textContent=`0${current+1} ${item.name} · ${item.caption}`;nav.innerHTML=steps.map((step,i)=>`<button type="button" data-index="${i}" class="${i===current?'active':''}" aria-current="${i===current?'step':'false'}"><b>0${i+1}</b>${step.name}</button>`).join('');document.getElementById('previous').disabled=current===0;document.getElementById('next').disabled=current===steps.length-1;history.replaceState(null,'',`?step=${current+1}`)}
    nav.addEventListener('click',event=>{const button=event.target.closest('[data-index]');if(button)show(Number(button.dataset.index))});
    document.getElementById('previous').addEventListener('click',()=>show(current-1));document.getElementById('next').addEventListener('click',()=>show(current+1));
    document.addEventListener('keydown',event=>{if(event.key==='ArrowLeft')show(current-1);if(event.key==='ArrowRight')show(current+1)});show(current);
  </script>
</body>
</html>
