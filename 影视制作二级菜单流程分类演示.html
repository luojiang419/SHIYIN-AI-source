<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>影视制作二级菜单流程分类演示</title>
  <script defer src="static/vendor/js/lucide.js"></script>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0c1214;
      --panel: #151e21;
      --button: #1c272b;
      --button-hover: #243236;
      --line: #344449;
      --line-soft: #29373b;
      --text: #f1f5f4;
      --muted: #aab8b8;
      --accent: #75f0ca;
      --accent-soft: rgba(117, 240, 202, .09);
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 "Microsoft YaHei UI", "Microsoft YaHei", system-ui, sans-serif;
    }

    button { font: inherit; }

    .page {
      width: min(920px, calc(100% - 40px));
      margin: 0 auto;
      padding: 34px 0 48px;
    }

    .page-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 24px;
      line-height: 1.3;
      letter-spacing: 0;
    }

    .subtitle { margin: 0; color: var(--muted); }

    .stage-count {
      flex: 0 0 auto;
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
    }

    .menu-demo {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 20px 70px rgba(0, 0, 0, .24);
    }

    .menu-title {
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 16px 20px 12px;
      color: #d4dfdd;
      font-size: 12px;
    }

    .menu-title svg, .node-button svg, .workflow-button svg {
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
      stroke-width: 1.8;
    }

    .menu-body { padding: 0 20px 12px; }

    .workflow-button,
    .node-button {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 7px;
      background: var(--button);
      color: var(--text);
      cursor: pointer;
      text-align: left;
      transition: border-color .15s ease, background .15s ease, transform .15s ease;
    }

    .workflow-button {
      height: 40px;
      padding: 0 12px;
      color: var(--accent);
      font-weight: 700;
    }

    .node-button {
      height: 38px;
      padding: 0 11px;
      font-size: 13px;
      font-weight: 650;
    }

    .workflow-button:hover,
    .node-button:hover,
    .workflow-button:focus-visible,
    .node-button:focus-visible {
      outline: none;
      border-color: var(--accent);
      background: var(--button-hover);
      transform: translateY(-1px);
    }

    .phase {
      display: grid;
      grid-template-columns: 126px minmax(0, 1fr);
      gap: 14px;
      padding: 15px 4px 16px;
      border-top: 1px solid var(--line);
    }

    .phase:first-of-type { margin-top: 10px; }

    .phase-heading {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin: 1px 0 0;
      color: var(--accent);
      font-size: 13px;
      font-weight: 750;
      cursor: pointer;
      user-select: none;
    }

    .phase-heading svg {
      width: 14px;
      height: 14px;
      margin-top: 3px;
      transition: transform .16s ease;
    }

    .phase.collapsed .phase-heading svg { transform: rotate(-90deg); }
    .phase.collapsed .phase-content { display: none; }

    .phase-copy {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .node-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px;
    }

    .node-button span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      z-index: 10;
      max-width: calc(100vw - 32px);
      padding: 9px 14px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #202c30;
      color: var(--text);
      box-shadow: 0 10px 34px rgba(0, 0, 0, .35);
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 8px);
      transition: opacity .16s ease, transform .16s ease;
    }

    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 660px) {
      .page { width: min(100% - 20px, 520px); padding-top: 20px; }
      .page-head { align-items: flex-start; flex-direction: column; gap: 6px; }
      h1 { font-size: 20px; }
      .menu-body { padding-inline: 12px; }
      .menu-title { padding-inline: 14px; }
      .phase { grid-template-columns: 1fr; gap: 6px; padding-inline: 2px; }
    }

    @media (max-width: 420px) {
      .node-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="page-head">
      <div>
        <h1>影视制作二级菜单</h1>
        <p class="subtitle">按真实制作流程组织现有节点，阶段标题可点击折叠。</p>
      </div>
      <div class="stage-count">5 个阶段 · 15 个节点</div>
    </header>

    <section class="menu-demo" aria-label="影视制作二级菜单演示">
      <div class="menu-title"><i data-lucide="clapperboard"></i><span>影视制作</span></div>
      <div class="menu-body">
        <button class="workflow-button" type="button" data-name="创建影视工作流">
          <i data-lucide="workflow"></i><span>创建影视工作流</span>
        </button>

        <section class="phase">
          <h2 class="phase-heading" tabindex="0"><i data-lucide="chevron-down"></i><span>01 资产筹备</span></h2>
          <div class="phase-content">
            <p class="phase-copy">建立角色、场景和造型等可复用视觉资产。</p>
            <div class="node-grid">
              <button class="node-button" type="button" data-name="准备资产"><i data-lucide="boxes"></i><span>准备资产</span></button>
              <button class="node-button" type="button" data-name="创建三视图"><i data-lucide="panels-top-left"></i><span>创建三视图</span></button>
            </div>
          </div>
        </section>

        <section class="phase">
          <h2 class="phase-heading" tabindex="0"><i data-lucide="chevron-down"></i><span>02 镜头预演</span></h2>
          <div class="phase-content">
            <p class="phase-copy">规划场景空间、摄影机位、人物动作与画面结构参考。</p>
            <div class="node-grid">
              <button class="node-button" type="button" data-name="720°取景器"><i data-lucide="scan-line"></i><span>720°取景器</span></button>
              <button class="node-button" type="button" data-name="3D导演台"><i data-lucide="clapperboard"></i><span>3D导演台</span></button>
              <button class="node-button" type="button" data-name="外部导演台"><i data-lucide="box"></i><span>外部导演台</span></button>
              <button class="node-button" type="button" data-name="动作提取"><i data-lucide="person-standing"></i><span>动作提取</span></button>
              <button class="node-button" type="button" data-name="深度图"><i data-lucide="scan"></i><span>深度图</span></button>
              <button class="node-button" type="button" data-name="一键复刻"><i data-lucide="refresh-cw"></i><span>一键复刻</span></button>
            </div>
          </div>
        </section>

        <section class="phase">
          <h2 class="phase-heading" tabindex="0"><i data-lucide="chevron-down"></i><span>03 分镜定稿</span></h2>
          <div class="phase-content">
            <p class="phase-copy">从草图到正式分镜，再完成镜头清单确认。</p>
            <div class="node-grid">
              <button class="node-button" type="button" data-name="生成线稿分镜"><i data-lucide="pencil-ruler"></i><span>生成线稿分镜</span></button>
              <button class="node-button" type="button" data-name="分镜合成"><i data-lucide="panels-top-left"></i><span>分镜合成</span></button>
              <button class="node-button" type="button" data-name="确认镜头"><i data-lucide="list-checks"></i><span>确认镜头</span></button>
            </div>
          </div>
        </section>

        <section class="phase">
          <h2 class="phase-heading" tabindex="0"><i data-lucide="chevron-down"></i><span>04 镜头生成</span></h2>
          <div class="phase-content">
            <p class="phase-copy">使用已确认的分镜和参考资产生成动态镜头。</p>
            <div class="node-grid">
              <button class="node-button" type="button" data-name="生成视频"><i data-lucide="clapperboard"></i><span>生成视频</span></button>
              <button class="node-button" type="button" data-name="LinkFox视频生成"><i data-lucide="sparkles"></i><span>LinkFox视频生成</span></button>
            </div>
          </div>
        </section>

        <section class="phase">
          <h2 class="phase-heading" tabindex="0"><i data-lucide="chevron-down"></i><span>05 后期处理</span></h2>
          <div class="phase-content">
            <p class="phase-copy">处理视频空间信息，并完成最终画质增强。</p>
            <div class="node-grid">
              <button class="node-button" type="button" data-name="深度视频"><i data-lucide="video"></i><span>深度视频</span></button>
              <button class="node-button" type="button" data-name="Topaz 高清放大"><i data-lucide="scan-line"></i><span>Topaz 高清放大</span></button>
            </div>
          </div>
        </section>
      </div>
    </section>
  </main>

  <div class="toast" role="status" aria-live="polite"></div>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) window.lucide.createIcons();

      document.querySelectorAll('.phase-heading').forEach((heading) => {
        const toggle = () => heading.closest('.phase').classList.toggle('collapsed');
        heading.addEventListener('click', toggle);
        heading.addEventListener('keydown', (event) => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            toggle();
          }
        });
      });

      const toast = document.querySelector('.toast');
      let toastTimer;
      document.querySelectorAll('[data-name]').forEach((button) => {
        button.addEventListener('click', () => {
          toast.textContent = `演示：将创建“${button.dataset.name}”节点`;
          toast.classList.add('show');
          clearTimeout(toastTimer);
          toastTimer = setTimeout(() => toast.classList.remove('show'), 1600);
        });
      });
    });
  </script>
</body>
</html>
